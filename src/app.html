<title>Hisn — азкары утра и вечера</title>
<script>
/* Тема ставится самой первой строкой, ещё до того как браузер нарисует страницу, —
   иначе в тёмной теме на долю секунды мелькал бы белый экран */
(function () {
  var t; try { t = JSON.parse(localStorage.getItem("azkar-theme")); } catch (e) {}
  var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<style>
/* Шрифт для арабского текста: KFGQPC HAFS Uthmanic Script (встроен без изменений) */
@font-face {
  font-family: "Hafs";
  src: url("data:font/otf;base64,__FONT__") format("opentype");
  font-display: swap;
}
/* Шрифт для русского текста: Nexa. Два начертания —
   обычное (400) для чтения и жирное (700) для заголовков и кнопок */
@font-face {
  font-family: "Nexa";
  src: url("data:font/otf;base64,__NEXA_REGULAR__") format("opentype");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: "Nexa";
  src: url("data:font/otf;base64,__NEXA_BOLD__") format("opentype");
  font-weight: 700;
  font-display: swap;
}
/* Макет: приложение на весь экран.
   Главная — две большие кнопки-картинки в ряд по центру экрана.
   Чтение — лента карточек, одна на экран, листается свайпом; счётчик всегда внизу.
   Две темы: светлая (ниже) и тёмная (:root[data-theme="dark"]). Все цвета берутся
   только из этих переменных — поэтому тема переключается сменой одного атрибута на <html> */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #1e2b23;
  --muted: #6b776f;
  --line: #e6ece8;
  --accent: #34c759;       /* зелёный из настроек iPhone — для заливок */
  --accent-ink: #248a3d;   /* тот же зелёный, но темнее — для мелкого текста, чтобы читался на белом */
  --counter-bg: #e8ece9;     /* серый фон счётчика — заметно темнее белого фона */
  --counter-fill: #d3d9d5;   /* серое заполнение, пока азкар не дочитан */
  --gold: #b0802a;
  --sh: 30, 43, 35;            /* цвет теней (R, G, B) — тёмно-зелёный, мягче чёрного */
  --bg-rgb: 255, 255, 255;     /* фон в виде R, G, B — для полупрозрачного растворения под счётчиком */
  --press: #f1f5f2;            /* подсветка нажатой кнопки и выбранной вкладки */
  --inactive: #b5beb8;         /* неактивные значки и стрелки */
  --track: #e3e9e5;            /* дорожка переключателей и ползунков */
  --sheet-btn: #f2f3f2;        /* кнопки в выезжающих окнах */
  --dim: rgba(30, 43, 35, .3); /* затемнение под выезжающим окном */
  --shadow: 0 1px 3px rgba(var(--sh), .04), 0 8px 24px rgba(var(--sh), .08);
  --edge: rgba(var(--sh), .05);
  --ease: cubic-bezier(.22, .8, .3, 1);   /* быстро стартует и мягко тормозит */   /* почти невидимая граница, чтобы края были мягкими */
  --f-display: "Nexa", system-ui, sans-serif;
  --f-body: "Nexa", system-ui, sans-serif;
  --f-arabic: "Hafs", "Amiri", "Traditional Arabic", serif;
}
/* Тёмная тема: почти чёрный фон с зелёным оттенком, карточки чуть светлее фона.
   Зелёный — вариант iPhone для тёмного режима, он ярче и лучше читается на тёмном */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1310;
  --surface: #19201c;
  --fg: #e6ece8;
  --muted: #8d9993;
  --line: #29322d;
  --accent: #30d158;
  --accent-ink: #30d158;
  --counter-bg: #222a25;
  --counter-fill: #36423b;
  --gold: #d6a84e;
  --sh: 0, 0, 0;
  --bg-rgb: 14, 19, 16;
  --press: #252e29;
  --inactive: #5d6a63;
  --track: #39443e;
  --sheet-btn: #252d28;
  --dim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  --edge: rgba(255, 255, 255, .06);
}
html { background: var(--bg); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15.5px; line-height: 1.5;
  padding: 0;   /* без отступов: экран чтения идёт от края до края, отступы — внутри экранов */
  overflow: hidden;
}
[hidden] { display: none !important; }
/* Убираем серую вспышку, которой iPhone подсвечивает нажатую кнопку.
   Вместо неё у кнопок своя анимация: лёгкое «проседание» */
* { -webkit-tap-highlight-color: transparent; }
/* Полосы прокрутки не показываем нигде */
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
.counter .label:empty { display: none; }
/* Жирным — заголовки и надписи на кнопках, обычным — тексты для чтения */
h1, h2, b, .back, .tab-item, .counter .label, .counter .num, .btn, .sheet-btn, .choice-row .txt { font-weight: 700; }
.choice-row small { font-weight: 400; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.screen { height: 100%; max-width: 576px; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; }

/* ---------- Главная ---------- */
/* Снизу отступ больше, чем сверху: так блок стоит в «визуальном центре» — чуть выше
   середины экрана, где глаз и ожидает середину */
#home { --gap: clamp(28px, 6vh, 56px); gap: var(--gap); padding-block: 24px calc(110px + 12vh - var(--gap)); overflow-y: auto; }
/* Центрируем «пружинами» сверху и снизу, а не justify-content: center: если блок не влезает
   по высоте (iPhone SE), center обрезал бы верх так, что до него не долистать.
   Нижняя пружина — отдельный пустой элемент, поэтому из отступа снизу вычли один --gap */
#home > .home-title { margin-top: auto; }
#home::after { content: ""; margin-top: auto; }
.home-title { display: grid; gap: 2px; text-align: center; }
.home-title h1 { font-size: clamp(28px, 4.4vh, 38px); }
.home-title .ar-title { font-family: var(--f-arabic); font-size: clamp(44px, 7vh, 60px); line-height: 1.5; color: var(--gold); }
h1 { font-family: var(--f-display); font-size: clamp(26px, 6.5vw, 31px); line-height: 1.1; margin: 0; text-wrap: balance; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.choice {
  display: grid; gap: 18px; justify-items: center; text-align: center;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 26px;
  box-shadow: var(--shadow); padding: 18px 14px 24px;
  transition: transform .15s ease, box-shadow .15s ease;
}
.choice:active { transform: scale(.98); }
/* Отметка «прочитано сегодня»: зелёный кружок с галочкой в углу кнопки.
   Спрятана (масштаб 0), а когда у кнопки появляется класс done — «выпрыгивает» */
.choice { position: relative; }
.done-badge {
  position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--surface), 0 3px 8px rgba(52, 199, 89, .3);
  transform: scale(0); opacity: 0;
  transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), opacity .2s ease;   /* лёгкий перелёт — как пружинка */
}
.done-badge svg { width: 12px; height: 12px; }
.choice.done .done-badge { transform: scale(1); opacity: 1; }
.choice img { width: 100%; max-width: 100%; box-shadow: 0 6px 18px rgba(var(--sh), .12); aspect-ratio: 1; border-radius: 50%; object-fit: cover; display: block; }
.choice b { font-family: var(--f-display); font-size: 18px; line-height: 1.25; }

/* Переключатель «Основные | Полные». Родственник нижней панели, но другой формы:
   утопленная дорожка и белая «таблетка», которая переезжает с лёгкой пружиной */
.set-switch {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; align-self: center;
  width: min(280px, 100%); padding: 3px; border-radius: 13px; background: var(--counter-bg);
  margin-bottom: calc(14px - var(--gap));   /* к кнопкам ближе, чем к заголовку: это их настройка */
}
.set-switch::before {
  content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
  border-radius: 10px; background: var(--surface);
  box-shadow: 0 1px 2px rgba(var(--sh), .10), 0 3px 10px rgba(var(--sh), .10);
  transition: transform .38s cubic-bezier(.25, .8, .25, 1);   /* мягко тормозит у края, без перелёта: с перелётом на телефоне выезжала за дорожку */
}
.set-switch[data-set="full"]::before { transform: translateX(100%); }
:root[data-theme="dark"] .set-switch::before { background: #343f38; }   /* в тёмной теме фон карточек сливается с дорожкой */
.set-opt {
  position: relative; border: 0; background: none; padding: 8px 6px; border-radius: 10px;
  font-size: 14px; font-weight: 700; color: var(--muted); transition: color .25s ease, transform .15s ease;
}
.set-opt[aria-checked="true"] { color: var(--fg); }
.set-opt:active { transform: scale(.96); }
/* Число азкаров под названием на кнопке; при смене набора мягко «перещёлкивается» */
.choice-count { font-size: 12.5px; color: var(--muted); margin-top: -12px; font-variant-numeric: tabular-nums; }
.choice-count.flip { animation: count-flip .35s var(--ease); }
@keyframes count-flip { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }

/* Аят дня — под кнопками утро/вечер. Свёрнут: перевод в три строки, арабский спрятан.
   Нажатие раскрывает целиком (арабский + весь перевод) */
.ayah-day {
  display: grid; gap: 8px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 22px;
  box-shadow: var(--shadow); padding: 16px 18px 18px;
  margin-top: calc(18px - var(--gap));   /* ближе к кнопкам, чем общий отступ главной */
  transition: transform .15s ease;
}
.ayah-day:active { transform: scale(.99); }
.ayah-label { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); }
.ayah-day .ayah-ar { display: none; font-size: calc(23px * var(--ar-k, 1)); line-height: 1.9; }   /* .ayah-day впереди: правило .ar ниже не перебьёт размер */
.ayah-ru { font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.ayah-ref { font-size: 12.5px; color: var(--muted); }
.ayah-day[aria-expanded="true"] .ayah-ar { display: block; }
.ayah-day[aria-expanded="true"] .ayah-ru { -webkit-line-clamp: unset; display: block; }

/* ---------- Чтение ---------- */
/* Чтение — на всю ширину экрана: карточки при свайпе уезжают прямо за край телефона,
   а не обрезаются по невидимой линии. Отступ для текста — внутри карточки */
#reader { padding-block: 10px 0; padding-inline: 0; max-width: none; gap: 10px; overflow: hidden; }
/* Приложение на экране «Домой» (без адресной строки Safari): iOS слегка размывает
   полосу под часами и батареей. Отодвигаем заголовок чтения ниже этой полосы */
@media (display-mode: standalone) { #reader { padding-top: 22px; } }
html.standalone #reader { padding-top: 22px; }
#reader .topbar { margin-inline: 20px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { border: 0; background: none; padding: 4px 0; color: var(--accent-ink); font-size: 15px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.top-right { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 0; background: none;
  display: grid; place-items: center; color: var(--muted);
  transition: background .2s ease, transform .15s ease;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:active { background: var(--press); transform: scale(.92); }

.viewport { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.track { display: flex; height: 100%; transition: transform .38s var(--ease); will-change: transform; transform: translate3d(0,0,0); }
.track.dragging { transition: none; }
/* Каждая карточка — свой экран с прокруткой. Сначала виден арабский текст и счётчик,
   перевод и транскрипция ниже — до них листают пальцем.
   Полосу прокрутки прячем так: прокручиваемый блок (.scroll) на 24px шире карточки,
   а карточка обрезает всё, что за её краем. Полоса оказывается в обрезанной части */
/* touch-action не «просачивается» через блок с прокруткой: у .scroll своё значение, иначе браузер
   перехватывает горизонтальный жест, присылает pointercancel, и карточка не едет за пальцем.
   Поэтому pan-y указан и на карточке, и на .scroll */
.slide { flex: 0 0 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; }
/* Карточки дальше чем на одну от текущей прячем: телефон не держит в памяти
   полтора десятка экранов с большим текстом, а свайп идёт только к соседней */
.slide.far { visibility: hidden; }
.slide > .scroll {
  touch-action: pan-y;
  height: 100%; width: calc(100% + 24px); overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; padding-left: 20px; padding-right: 44px;
}
.content { display: flex; flex-direction: column; gap: 14px; padding-block: 14px 8px; width: 100%; max-width: 560px; margin-inline: auto; }   /* на широком экране текст не растягивается */
.ar { font-family: var(--f-arabic); font-size: calc(28px * var(--ar-k, 1)); line-height: 1.95; direction: rtl; text-align: center; margin: 0; }
.ru { margin: 0; font-size: calc(15.5px * var(--tx-k, 1)); white-space: pre-line; }   /* переносы строк в переводе (суры по аятам) */
.tr { margin: 0; color: var(--muted); font-size: calc(14.5px * var(--tx-k, 1)); }
.src { margin: 0; font-size: calc(12.5px * var(--tx-k, 1)); color: var(--muted); }
.nowrap { white-space: nowrap; }
.ar-comma { font-family: "Amiri", "Traditional Arabic", serif; }
.divider { height: 1px; background: var(--line); margin-block: 4px; }

/* Нижняя панель со счётчиком: прилипает к низу экрана,
   а текст, который уходит под неё, слегка размывается.
   Размытие лежит отдельным слоем (::before) и плавно появляется сверху,
   а по бокам доходит до самого края экрана — без видимых границ */
.dock {
  position: sticky; bottom: 0; z-index: 1; margin-top: auto;
  margin-left: -20px; margin-right: -44px; padding: 24px 44px calc(10px + env(safe-area-inset-bottom, 0px)) 20px;
  display: grid; gap: 6px;
}
.dock::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  /* к низу экрана текст плавно растворяется в белый — без резкой границы */
  background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0), rgba(var(--bg-rgb), .6) 40%, rgba(var(--bg-rgb), .97) 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 24px);
  mask-image: linear-gradient(to bottom, transparent, #000 24px);
}
/* Размытие включено всегда: раньше мы выключали его на время свайпа, и оно пропадало под пальцем,
   а само переключение вызывало перерисовку и рывок в начале жеста. Далёкие карточки скрыты (.far),
   так что размытие считается только у текущей и двух соседних */
.dock::before { -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }   /* было 4px, потом 3px — Майрбек попросил ещё мягче */

/* Счётчик: длинная кнопка, которая заполняется по мере нажатий */
.dock > *, .item > .counter { width: 100%; max-width: 560px; margin-inline: auto; }
.counter {
  position: relative; overflow: hidden; width: 100%; border: 0; border-radius: 14px;
  background: var(--counter-bg); padding: 14px 18px; min-height: 54px;
  display: flex; justify-content: center; align-items: center; gap: 12px;
  font-size: 14px; user-select: none; -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 0 0 1px rgba(var(--sh), .08), 0 2px 4px rgba(var(--sh), .06), 0 8px 20px rgba(var(--sh), .10);
}
.counter .fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: var(--counter-fill); transition: transform .3s var(--ease), background .35s ease; }
.counter.full .fill { background: var(--accent); }   /* дочитал — кнопка становится зелёной */
.counter span { position: relative; }
.counter .num { font-size: 17px; font-variant-numeric: tabular-nums; }
.counter { transition: transform .15s ease, color .35s ease; }
.counter.full { color: #fff; }
.counter:active { transform: scale(.99); }
/* margin-block, а не margin: 0 — иначе это правило стирает margin-inline: auto из .dock > *,
   и на широком экране (iPad) блок подсказки прижимается влево, а не стоит под счётчиком */
.hint { text-align: center; font-size: 11px; color: var(--muted); margin-block: 0; }

.final { flex: 1; display: grid; place-content: center; text-align: center; gap: 14px; padding-bottom: 16vh; }   /* компенсируем полосу сверху — надпись ровно посередине экрана */
.final h2 { font-family: var(--f-display); font-size: 25px; margin: 0; }
.btn { border: 1px solid var(--edge); background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 12px 18px; font-weight: 600; color: var(--accent-ink); }

/* ---------- Список (все азкары на одной странице) ---------- */
.list-view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-left: 20px; padding-right: 44px; margin-right: -24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }   /* тот же приём: полоса уходит за край экрана */
.item { display: flex; flex-direction: column; gap: 14px; padding-block: 18px 22px; border-bottom: 1px solid var(--line); }
.item .content { padding-block: 0; }
.list-view .final { padding-block: 40px 24px; }

/* ---------- Счётчик (тасбих) ---------- */
/* Просто число. Нажимаешь в любом месте средней части экрана — прибавляется.
   Три независимых счётчика переключаются «таблетками» сверху, в каждой — её число */
#tasbih { padding-block: 32px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 16px; overflow: hidden; touch-action: manipulation; }

.tb-slots { display: flex; justify-content: center; gap: 8px; }
.tb-slot {
  min-width: 64px; border: 1px solid var(--edge); background: var(--surface); box-shadow: var(--shadow);
  border-radius: 999px; padding: 6px 12px; display: flex; align-items: baseline; justify-content: center; gap: 6px;
  transition: transform .15s ease, background .25s ease, color .25s ease, box-shadow .25s ease;
}
.tb-slot b { font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.tb-slot[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(52, 199, 89, .28); border-color: transparent; }
.tb-slot:active { transform: scale(.96); }

/* Вся средняя часть экрана — одна большая кнопка */
.tb-stage {
  flex: 1; min-height: 140px; position: relative; outline: none;
  display: grid; place-items: center; container-type: size;
  border: 0; padding: 0; background: none; width: 100%;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
/* Круг занимает почти всю высоту свободного места, но не шире экрана */
.tb-dial { position: relative; width: min(100cqh - 40px, 100cqw - 48px, 270px); aspect-ratio: 1; display: grid; place-items: center; pointer-events: none; }
.tb-face {
  width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--surface);
  box-shadow: 0 2px 6px rgba(var(--sh), .06), 0 18px 44px rgba(var(--sh), .14);
  display: grid; place-content: center; text-align: center; transition: transform .12s ease;
}
.tb-stage:active .tb-face { transform: scale(.97); }
.tb-num { font-weight: 700; font-size: clamp(44px, 17cqh, 84px); line-height: 1; font-variant-numeric: tabular-nums; }
.tb-num.bump { animation: bump .28s var(--ease); }
.tb-hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; color: var(--muted); transition: opacity .4s ease; }
.tb-hint.gone { opacity: 0; }

#tasbih.enter > * { animation: rise .5s var(--ease) backwards; }
#tasbih.enter > :nth-child(2) { animation-delay: .06s; }
#tasbih.enter > :nth-child(3) { animation-delay: .12s; }

/* ---------- Окно «Размер текста» ---------- */
/* Множители --ar-k и --tx-k ставит программа на <html>; размеры текста в азкарах
   умножаются на них (calc выше). Так весь текст меняется одной строчкой */
.size-preview {
  border: 1px solid var(--edge); border-radius: 16px; padding: 10px 14px 12px;
  display: grid; gap: 4px; max-height: 34vh; overflow: hidden; margin-bottom: 4px;
}
.size-preview .ar { line-height: 1.8; }
.size-preview .ru { text-align: center; }
/* образец виден всегда, даже если какой-то текст выключен в «Что показывать» */
body .size-preview p { display: block; }
/* у окна свой стиль абзацев (мелкий серый текст) — для образца возвращаем размеры, как в азкарах */
.sheet .size-preview p { margin: 0; }
.sheet .size-preview .ar { font-size: calc(28px * var(--ar-k, 1)); color: var(--fg); }
.sheet .size-preview .ru { font-size: calc(15.5px * var(--tx-k, 1)); color: var(--fg); }
.sheet .size-preview .tr { font-size: calc(14.5px * var(--tx-k, 1)); }
.size-row { display: grid; gap: 8px; padding: 6px 4px; }
.size-row + .size-row { border-top: 1px solid var(--line); padding-top: 12px; }
.size-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px; }
.size-head output { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; font-size: 13px; }
.slider-line { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.slider-line .s { font-size: 13px; width: 16px; text-align: center; }
.slider-line .l { font-size: 21px; width: 16px; text-align: center; }
.slider-line .ar-glyph { font-family: var(--f-arabic); line-height: 1; }
/* Ползунок в духе iPhone: тонкая дорожка, слева зелёная до кружка (--p — сколько процентов заполнено) */
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 28px; margin: 0; background: none;
  touch-action: none;   /* палец на ползунке двигает ползунок, а не окно */
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--track) var(--p, 50%));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 3px 8px rgba(0,0,0,.16);
}
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
.sheet-btn.plain { background: none; color: var(--accent-ink); padding: 10px; }
.sheet-btn.plain:disabled { color: var(--inactive); }

/* ---------- Настройки (в духе настроек iPhone) ---------- */
#settings { overflow-y: auto; padding-block: 32px 100px; gap: 18px; font-size: 14px; }
#settings h1 { font-size: 24px; }
.group { display: grid; gap: 6px; }
.group-title { font-size: 11.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; padding-inline: 14px; }
.rows {
  background: var(--surface); border: 1px solid var(--edge); border-radius: 14px; box-shadow: var(--shadow);
  overflow: hidden;
}
/* Значки в строках настроек — цветные квадратики, как в настройках iPhone */
.lbl { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tile {
  flex: none; width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; line-height: 1;
}
.tile svg { width: 18px; height: 18px; }
.tile.ar-glyph { font-family: var(--f-arabic); font-size: 22px; font-weight: 400; padding-bottom: 8px; }
.tile-green { background: #34c759; }
.tile-blue { background: #007aff; }
.tile-orange { background: #ff9500; }
.tile-purple { background: #af52de; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 48px; padding: 8px 14px; background: none; border: 0; text-align: left;
}
.row + .row { border-top: 1px solid var(--line); }
.row .value { color: var(--muted); display: flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; }   /* «3 дуа» не переносится на две строки */
.row .value::after { content: "›"; font-size: 20px; line-height: 1; color: var(--inactive); }

/* ---------- Дуа: список тем, как настройки iPhone ---------- */
#duas { overflow-y: auto; padding-block: 32px 100px; gap: 18px; font-size: 15px; }
#duas h1 { font-size: 24px; }
#dua-groups { display: grid; gap: 18px; }
.search {
  display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 12px; box-shadow: var(--shadow);
  color: var(--muted);
}
.search svg { width: 17px; height: 17px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: inherit; font-size: 16px; }
.search input::placeholder { color: var(--inactive); }
.dua-row .value { font-variant-numeric: tabular-nums; }
.dua-row.soon { pointer-events: none; }
.dua-row.soon .lbl { opacity: .45; }
.dua-row.soon .value::after { content: none; }
.tile-indigo { background: #5856d6; }
.tile-teal { background: #30b0c7; }
.tile-red { background: #ff3b30; }
.tile-brown { background: #a2845e; }
.dua-empty { text-align: center; color: var(--muted); padding: 24px 0; }
/* Страница темы: карточки с кнопками (вариант B) */
#dua-read { overflow-y: auto; padding-block: 16px 110px; }
#dua-read .topbar { min-height: 30px; }
#dua-read h1 { margin-top: 6px; }
.dua-sub { margin: 4px 0 16px; color: var(--muted); font-size: 13px; }
.dua-cards { display: grid; gap: 14px; }
.dua-card {
  display: grid; gap: 10px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--shadow);
}
.dua-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
/* Как и когда читать — пояснение над дуа */
.dua-how { margin: 0; color: var(--muted); font-size: calc(14px * var(--tx-k, 1)); line-height: 1.45; }
.dua-num {
  flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--press); color: var(--accent-ink); font-size: 12px; font-weight: 700;
}
.dua-card .ar { margin: 2px 0; }
.dua-tr summary { color: var(--accent-ink); font-size: 13.5px; font-weight: 700; cursor: pointer; list-style: none; width: max-content; }
.dua-tr summary::-webkit-details-marker { display: none; }
.dua-tr summary::after { content: " ▾"; }
.dua-tr[open] summary::after { content: " ▴"; }
.dua-tr .tr { margin-top: 6px; }
.dua-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.dua-acts { display: flex; gap: 4px; }
.dua-act { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; border-radius: 10px; color: var(--muted); }
.dua-act svg { width: 20px; height: 20px; }
.dua-act:active { background: var(--press); }
.dua-act.fav.on { color: #ff9500; }
.dua-act.fav.on svg { fill: currentColor; }
/* Звезда «в избранное»: добавил — звезда «выпрыгивает» с поворотом, от неё расходится кольцо
   и разлетаются искорки; убрал — звезда коротко сжимается */
.dua-act.fav { position: relative; }
.dua-act.fav.pop svg { animation: star-pop .55s cubic-bezier(.2, .9, .3, 1.3); }
.dua-act.fav.unpop svg { animation: star-unpop .3s ease; }
@keyframes star-pop {
  0% { transform: scale(.2) rotate(-40deg); }
  55% { transform: scale(1.35) rotate(12deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes star-unpop { 40% { transform: scale(.7); } }
.fav-ring {
  position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border-radius: 50%; border: 2px solid #ff9500; pointer-events: none;
  animation: fav-ring .5s ease-out forwards;
}
@keyframes fav-ring { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.25); opacity: 0; border-width: .5px; } }
.fav-spark {
  position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
  border-radius: 50%; background: var(--c, #ff9500); pointer-events: none;
  animation: fav-spark .6s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes fav-spark {
  0% { transform: rotate(var(--a)) translateY(-6px) scale(1); opacity: 1; }
  100% { transform: rotate(var(--a)) translateY(-24px) scale(.2); opacity: 0; }
}
/* Короткая подсказка внизу экрана: «Скопировано» */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); font-size: 14px; font-weight: 700; white-space: nowrap;
  padding: 10px 16px; border-radius: 999px; box-shadow: 0 6px 20px rgba(var(--sh), .2); transition: opacity .2s ease, transform .25s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* Пометка над дуа: когда его говорят («Если забыл сказать в начале») */

/* Переключатель: дорожка и кружок */
.switch {
  flex: none; position: relative; width: 46px; height: 28px; border-radius: 999px;
  border: 0; background: var(--track); transition: background .25s var(--ease);
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--ease);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

/* Окно выбора, которое выезжает снизу */
.sheet-back { position: fixed; inset: 0; background: var(--dim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { animation: dim-in .25s ease; }
.sheet-back.closing, .sheet-back.closing-drag { animation: dim-out .22s ease forwards; }
.sheet-back.closing .sheet { animation: down .22s var(--ease) forwards; }
.sheet {
  width: min(560px, 100%); background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 10px 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px;
  font-size: 14px; animation: up .32s var(--ease);
}
.sheet::before { content: ""; justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet h2 { font-size: 15px; text-align: center; margin: 4px 0; }
.sheet p { margin: 0 0 6px; text-align: center; color: var(--muted); font-size: 13.5px; }
.sheet-btn {
  width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 15px;
  background: var(--sheet-btn); transition: transform .15s ease, background .2s ease;
}
.sheet-btn:active { transform: scale(.98); }
.sheet-btn.danger { color: #ff3b30; }          /* красный из iPhone: так в iOS выглядят необратимые действия */
.final .actions { display: grid; gap: 10px; justify-items: center; }
.choice-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border: 0; background: none; text-align: left; width: 100%; border-radius: 12px; }
.choice-row + .choice-row { border-top: 1px solid var(--line); border-radius: 0; }
.choice-row .txt { flex: 1; display: grid; gap: 1px; }
.choice-row small { color: var(--muted); font-size: 12.5px; }
.choice-row .check { flex: none; width: 20px; color: var(--accent-ink); font-size: 18px; visibility: hidden; }
.choice-row[aria-checked="true"] .check { visibility: visible; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes dim-in { from { background: rgba(var(--sh), 0); } }
@keyframes dim-out { to { background: rgba(var(--sh), 0); } }

/* Что показывать в азкарах: классы на <body> прячут нужные части */
body.no-ar .ar, body.no-ru .ru, body.no-tr .tr { display: none; }
body.no-ar .divider, body.no-ru.no-tr .divider { display: none; }

/* ---------- Нижняя панель ---------- */
/* Под панелью — такая же дымка, как за счётчиком: то, что уходит под неё, плавно растворяется и слегка размыто.
   Отдельный слой на всю ширину экрана: от низа до чуть выше панели (панель 62px + отступ 14px + 24px плавного края — как у счётчика) */
.tab-veil {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; pointer-events: none;
  height: calc(100px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0), rgba(var(--bg-rgb), .6) 40%, rgba(var(--bg-rgb), .97) 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 24px);
  mask-image: linear-gradient(to bottom, transparent, #000 24px);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  transition: opacity .25s ease;
}
.tab-veil.away { opacity: 0; }   /* в чтении панели нет — и дымки нет (там своя, за счётчиком) */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100% - 32px));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 999px;
  box-shadow: 0 2px 6px rgba(var(--sh), .06), 0 10px 28px rgba(var(--sh), .12);
  padding: 4px; z-index: 10;
  transition: transform .35s var(--ease), opacity .25s ease;
}
.tabbar.away { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
.tabbar::before {
  content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 20px) / 4);
  border-radius: 999px; background: var(--press); transition: transform .38s var(--ease);
}
/* Подложка переезжает под выбранную вкладку: на одну, две или три своих ширины + промежутки */
.tabbar[data-active="duas"]::before { transform: translateX(calc(100% + 4px)); }
.tabbar[data-active="tasbih"]::before { transform: translateX(calc(200% + 8px)); }
.tabbar[data-active="settings"]::before { transform: translateX(calc(300% + 12px)); }
.tab-item {
  display: grid; justify-items: center; gap: 2px; border: 0; background: none;
  border-radius: 999px; padding: 6px 6px 5px; color: var(--inactive); font-size: 12px; position: relative;
  transition: color .25s ease, transform .15s ease;
}
.tab-item svg { width: 21px; height: 21px; }
.tab-item[aria-selected="true"] { color: var(--accent-ink); }

/* ---------- Анимации ---------- */
/* Экран появляется: лёгкое проявление со сдвигом снизу */
.screen.enter { animation: screen-in .35s var(--ease); }
/* Экран чтения появляется сразу, без проявления и сдвига. Пока у экрана меняется прозрачность,
   размытие под нижней панелью не работает и включается только в конце — было видно, как оно «догоняет».
   Без анимации размытие есть с первого кадра, а текст на iPhone остаётся чётким */
#reader.enter { animation: none; }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px); } }

/* На главной элементы появляются по очереди */
#home.enter .home-title, #home.enter .choice { animation: rise .5s var(--ease) backwards; }
#home.enter .choice:nth-child(1) { animation-delay: .06s; }
#home.enter .choice:nth-child(2) { animation-delay: .12s; }
/* Хадисы и строки настроек — тоже по очереди, задержку задаёт --i */
#settings.enter .group, #duas.enter .group, #dua-read.enter .dua-card { animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* Нажатие: кнопка чуть «проседает» */
.choice, .btn, .row, .choice-row, .counter { transition: transform .15s ease, box-shadow .2s ease, background .2s ease; }
.btn:active, button.row:active { transform: scale(.98); }
.choice-row:active { background: var(--press); }
.tab-item:active { transform: scale(.94); }
.counter:active { transform: scale(.985); }

/* Счётчик: цифра «подпрыгивает» при нажатии, надпись «Прочитано» мягко появляется */
.counter .num.bump { animation: bump .28s var(--ease); }
@keyframes bump { 40% { transform: scale(1.22); } }
.counter.full .label { animation: fade .35s ease; }

/* Финальная карточка */
.final { animation: rise .5s var(--ease) backwards; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

    ar: "بِسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِيمِ\nقُلْ هُوَ ٱللَّهُ أَحَدٌ [١] ٱللَّهُ ٱلصَّمَدُ [٢] لَمْ يَلِدْ وَلَمْ يُولَدْ [٣] وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ [٤]",
    ru: "[1] Скажи: «Он - Аллах Единый, [2] Аллах Самодостаточный. [3] Он не родил и не был рожден, [4] и нет никого равного Ему».",
    tr: "Куль хува-Ллаху ахад. Аллаху-ссамад. Лям ялид ва лям юляд. Ва лям якулляху куфуван ахад.",
    src: "Абу Дауд 5082, ан-Насаи 8/250" },
  { id: "e-falaq", when: ["evening"], times: 3, name: "Сура аль-Фаляк",
    ar: "بِسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ [١] مِن شَرِّ مَا خَلَقَ [٢] وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ [٣] وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ [٤] وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ [٥]",
    ru: "[1] Скажи: «Прибегаю к защите Господа рассвета [2] от зла того, что Он сотворил, [3] от зла мрака, когда он наступает, [4] от зла колдуний, поплевывающих на узлы, [5] от зла завистника, когда он завидует».",
    tr: "Куль а'узу би раббиль фаляк. Мин шарри ма холяк. Ва мин шарри гасикин иза вакаб. Ва мин шарри-ннаффасати филь укад. Ва мин шарри хасидин иза хасад.",
    src: "Абу Дауд 5082, ан-Насаи 8/250" },
  { id: "e-nas", when: ["evening"], times: 3, name: "Сура ан-Нас",
    ar: "بِسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ [١] مَلِكِ ٱلنَّاسِ [٢] إِلَـٰهِ ٱلنَّاسِ [٣] مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ [٤] ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ [٥] مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ [٦]",
    ru: "[1] Скажи: «Прибегаю к защите Господа людей, [2] Царя людей, [3] Бога людей, [4] от зла искусителя отступающего (или сжимающегося) при поминании Аллаха, [5] который наущает в груди людей [6] и бывает из джиннов и людей».",
    tr: "Куль а'узу би рабби-ннас. Малики-ннас. Иляхи-ннас. Мин шарриль васвасиль хоннас. Аллязи ювасвысу фи судури-ннас. Миналь джиннати ва-ннас.",
    src: "Абу Дауд 5082, ан-Насаи 8/250" },
  { id: "e-sayyid", when: ["evening"], times: 1, name: "Господин молитв о прощении",
    ar: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
    ru: "О Аллах, Ты - Господь мой, и нет достойного поклонения, кроме Тебя, Ты создал меня, а я - Твой раб, и я буду хранить верность Тебе, пока у меня хватит сил. Прибегаю к Тебе от зла того, что я сделал, признаю милость, оказанную Тобой мне, и признаю грех свой. Прости же меня, ибо, поистине, никто не прощает грехов, кроме Тебя!",
    tr: "Аллахумма, Анта Рабби, ля иляха илля Анта, халякта-ни ва ана 'абду-кя, ва ана 'аля 'ахди-кя ва ва'ди-кя ма-стата'ту. А'узу би-кя мин шарри ма сана'ту, абу'у ля-кя би-ни'мати-кя 'аляййя, ва абу'у ля-кя би-занби, фа-гфир ли, фа-инна-ху ля йагфиру-з-зунуба илля Анта!",
    src: "аль-Бухари 6306" },
  { id: "e-hasbi", when: ["evening"], times: 7, name: "Хасбия-Ллаху…",
    ar: "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",
    ru: "Достаточно мне Аллаха, нет достойного поклонения, кроме Него, на Него я уповаю и Он - Господь великого трона.",
    tr: "Хасбия-Ллаху, ля иляха илля хуа, 'аляй-хи таваккяльту ва хуа Раббу-ль-'арши-ль-'азыми.",
    src: "Абу Дауд 5081" },
  { id: "e-bismillah", when: ["evening"], times: 3, name: "Бисмилляхи-ллязи ля йадурру…",
    ar: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",
    ru: "С именем Аллаха, с именем Которого ничто не причинит вред ни на земле, ни на небе, ведь Он - Слышащий, Знающий!",
    tr: "Би-сми-Лляхи аллязи ля йадурру ма'а исми-хи шайун фи-ль-арди ва ля фи-с-самаи ва хуа-с-Сами'у-ль-'Алиму",
    src: "ат-Тирмизи 3388" },
  { id: "e-radiitu", when: ["evening"], times: 3, name: "Радийту би-Лляхи Раббан…",
    ar: "رَضِيتُ بِاللَّهِ رَبًّا ، وَبِالْإسْلَامِ دِيناً وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",
    ru: "Доволен я Аллахом как Господом, исламом - как религией и Мухаммадом, - как пророком!",
    tr: "Радийту би-Лляхи Раббан, ва би-ль-ислами динан ва би-Мухаммадин, сал-ля-Ллаху 'аляй-хи ва салляма, набийан",
    src: "Абу Дауд 5072, ат-Тирмизи 3389" },
  { id: "e-bika", when: ["evening"], times: 1, name: "Аллахумма бика амсайна…",
    ar: "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ",
    ru: "О Аллах, благодаря Тебе мы дожили до вечера и благодаря Тебе мы дожили до утра, Ты даёшь нам жизнь, и Ты лишаешь нас её и Ты воскресишь нас для отчета.",
    tr: "Аллахумма, би-кя амсайна, ва би-кя асбахна, ва би-кя нахйа, ва би-кя намуту ва иляй-кя-н-нушуру",
    src: "ат-Тирмизи 3391" },
  { id: "e-hayyu", when: ["evening"], times: 1, name: "Йа Хаййу, йа Кайюму…",
    ar: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",
    ru: "О Живой, о Вечносущий, обращаюсь за защитой к милосердию Твоему, приведи в порядок все мои дела и не доверяй меня душе моей ни на мгновение!",
    tr: "Йа Хаййу, йа Кайюму, би-рахмати-кя астагису, аслих ли ша'ни кулля-ху ва ля такиль-ни иля нафси тарфата 'айнин!",
    src: "аль-Хаким 1/545" },
  { id: "e-alim", when: ["evening"], times: 1, name: "Аллахумма 'Алима-ль-гайби…",
    ar: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",
    ru: "О Аллах, Знающий сокрытое и явное, Творец небес и земли, Господь и Владыка всего, свидетельствую, что нет достойного поклонения, кроме Тебя, прибегаю к Тебе от зла души своей, от зла и многобожия шайтана и от того, чтобы причинить зло самому себе или навлечь его на какого-нибудь мусульманина.",
    tr: "Аллахумма, 'Алима-ль-гайби ва-ш-шахадати, Фатира-с-самавати ва-ль-арди, Рабба кулли шайин ва Малика-ху, ашхаду алля иляха илля Анта, а'узу би-кя мин шарри нафси, ва мин шарри-ш-шайтани ва ширки-хи ва ан актарифа 'аля нафси су'ан ау аджурра-ху иля мусли-мин.",
    src: "ат-Тирмизи 3529 (48/160)" },
  { id: "e-tahlil10", when: ["evening"], times: 10, name: "Ля иляха илля-Ллах… 10 раз",
    ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
    ru: "Нет достойного поклонения, кроме одного лишь Аллаха, у которого нет сотоварища, Ему принадлежит владычество, Ему хвала, Он всё может.",
    tr: "Ля иляха илля-Ллаху вахда-ху ля шарикя ля-ху, ля-ху-ль-мульку ва ля-ху-ль-хамду ва хуа 'аля кулли шайин кадир.",
    src: "Муслим 2693, 2691" },
  { id: "e-subhan100", when: ["evening"], times: 100, name: "Субхана-Ллахи ва би-хамдихи",
    ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
    ru: "Пречист Аллах и хвала Ему.",
    tr: "Субхана-Ллахи ва би-хамди-хи.",
    src: "Муслим 2692" },
  { id: "e-kursi", when: ["evening"], times: 1, name: "Аят аль-Курси",
    ar: "ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ [٢٥٥]",
    ru: "Аллах - нет божества, кроме Него, Живого, Вседержителя. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания только то, что Он пожелает. Его Престол (Подножие Трона) объемлет небеса и землю, и не тяготит Его оберегание их. Он - Возвышенный, Великий.",
    tr: "Аллаху ляя иляяхьа илляя хуваль-хайюль-койюум, ляя та - хузуху синатув-валяя навм, ляхумаафис-самаавати вамаафиль-ард, ман зал-лязии яшфя‘у ‘индаху илля би изних, я‘ляму маа байна айдиихим ва маа хальфахум ва ляя юхиитуунэ би шэйим-мин ‘ильмихи илля би маа шаа‘а, васи‘а курсийюху ссамаавати валь-ард, ва ляя яудуху хифзухумаа ва хуваль-‘алийюль-‘азыим.",
    src: "Ибн Хиббан 784" },
  { id: "e-amsayna", when: ["evening"], times: 1, name: "Амсайна ва амса-ль-мульку ли-Ллях…",
    ar: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ ، وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",
    ru: "Мы дожили до вечера, и этим вечером владычество принадлежит Аллаху, и хвала Аллаху, нет достойного поклонения, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он всё может. Господь мой, прошу Тебя о благе того, что будет в эту ночь, и благе того, что за ней последует, и прибегаю к Тебе от зла того, что будет в эту ночь, и зла того, что за ней последует. Господь мой, прибегаю к Тебе от нерадения и старческой дряхлости, Господь мой, прибегаю к Тебе от мучений в огне и мучений в могиле!",
    tr: "Амсайна ва амса-ль-мульку ли-Лляхи ва-ль-хамду ли-Лляхи, ля иляха илля Ллаху вахда-ху ля шарикя ля-ху, ля-ху-ль-мульку ва ля-ху-ль-хамду ва хуа ааля кулли шайин кадирун. Рабби ас'алюкя хайра ма фи хазихи-ль-лейляти ва хайра ма ба'адаха ва а'узу бикя мин шарри ма фи хазихи-ль-лейляти ва шарри ма ба'адаха Рабби, а'узу би-кя мин аль-кясали ва суи-ль-кибари, Рабби, а'узу би-кя мин 'азабин фи-н-нари ва 'азабин фи-ль-кабри!",
    src: "Муслим 2723" },
  { id: "e-kalimat", when: ["evening"], times: 3, name: "А‘узу би-кялимати-Ллях…",
    ar: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
    ru: "Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.",
    tr: "А'узу би-кялимати Лляхи-т-таммати мин шарри ма халяка.",
    src: "Муслим 2709" },
  { id: "e-afiya", when: ["evening"], times: 1, name: "Аллахумма инни ас'алюка-ль-'афийа…",
    ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",

  { ref: "аль-Инсан, 25–26",
    ar: "وَٱذْكُرِ ٱسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا [٢٥] وَمِنَ ٱلَّيْلِ فَٱسْجُدْ لَهُۥ وَسَبِّحْهُ لَيْلًا طَوِيلًا [٢٦]",
    ru: "Поминай имя твоего Господа утром и перед закатом, а также ночью. Падай ниц пред Ним и славь Его долгой ночью." },
  { ref: "ар-Рум, 17–18",
    ar: "فَسُبْحَـٰنَ ٱللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ [١٧] وَلَهُ ٱلْحَمْدُ فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَعَشِيًّا وَحِينَ تُظْهِرُونَ [١٨]",
    ru: "Славьте же Аллаха, когда для вас наступает вечер и когда наступает утро! Ему надлежит хвала на небесах и на земле. Славьте Его после полудня и в полдень!" },
  { ref: "аль-Бакара, 155–157",
    ar: "وَلَنَبْلُوَنَّكُم بِشَىْءٍ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ ۗ وَبَشِّرِ ٱلصَّـٰبِرِينَ [١٥٥] ٱلَّذِينَ إِذَآ أَصَـٰبَتْهُم مُّصِيبَةٌ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ [١٥٦] أُو۟لَـٰٓئِكَ عَلَيْهِمْ صَلَوَٰتٌ مِّن رَّبِّهِمْ وَرَحْمَةٌ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُهْتَدُونَ [١٥٧]",
    ru: "Мы непременно испытаем вас незначительным страхом, голодом, потерей имущества, людей и плодов. Обрадуй же терпеливых, которые, когда их постигает беда, говорят: «Воистину, мы принадлежим Аллаху, и к Нему мы вернемся». Они удостаиваются благословения своего Господа и милости. Они следуют прямым путем." },
  { ref: "аль-Хадид, 3",
    ar: "هُوَ ٱلْأَوَّلُ وَٱلْـَٔاخِرُ وَٱلظَّـٰهِرُ وَٱلْبَاطِنُ ۖ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ [٣]",
    ru: "Он - Первый и Последний, Высочайший и Ближайший. Он знает о всякой вещи." },
  { ref: "ан-Нахль, 97",
    ar: "مَنْ عَمِلَ صَـٰلِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُۥ حَيَوٰةً طَيِّبَةً ۖ وَلَنَجْزِيَنَّهُمْ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا۟ يَعْمَلُونَ [٩٧]",
    ru: "Верующих мужчин и женщин, которые поступали праведно, Мы непременно одарим прекрасной жизнью и вознаградим за лучшее из того, что они совершали." },
  { ref: "ан-Ниса, 110",
    ar: "وَمَن يَعْمَلْ سُوٓءًا أَوْ يَظْلِمْ نَفْسَهُۥ ثُمَّ يَسْتَغْفِرِ ٱللَّهَ يَجِدِ ٱللَّهَ غَفُورًا رَّحِيمًا [١١٠]",
    ru: "Если кто-либо совершит злодеяние или будет несправедлив по отношению к себе, а затем попросит у Аллаха прощения, то он найдет Аллаха Прощающим и Милосердным." },
  { ref: "аль-Хиджр, 49–50",
    ar: "۞ نَبِّئْ عِبَادِىٓ أَنِّىٓ أَنَا ٱلْغَفُورُ ٱلرَّحِيمُ [٤٩] وَأَنَّ عَذَابِى هُوَ ٱلْعَذَابُ ٱلْأَلِيمُ [٥٠]",
    ru: "Сообщи Моим рабам, что Я - Прощающий, Милосердный, но наказание Мое - наказание мучительное." },
  { ref: "аль-А'раф, 56",
    ar: "وَلَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ بَعْدَ إِصْلَـٰحِهَا وَٱدْعُوهُ خَوْفًا وَطَمَعًا ۚ إِنَّ رَحْمَتَ ٱللَّهِ قَرِيبٌ مِّنَ ٱلْمُحْسِنِينَ [٥٦]",
    ru: "Не распространяйте нечестия на земле после того, как она приведена в порядок. Взывайте к Нему со страхом и надеждой. Воистину, милость Аллаха близка к творящим добро." },
  { ref: "аль-А'ля, 14–15",
    ar: "قَدْ أَفْلَحَ مَن تَزَكَّىٰ [١٤] وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ [١٥]",
    ru: "Преуспел тот, кто очистился, поминал имя своего Господа и совершал намаз." },
  { ref: "Али 'Имран, 8",
    ar: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ [٨]",
    ru: "Господь наш! Не уклоняй наши сердца в сторону после того, как Ты наставил нас на прямой путь, и даруй нам милость от Себя, ведь Ты - Дарующий!" },
  { ref: "аль-Бакара, 201",
    ar: "وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةً وَفِى ٱلْـَٔاخِرَةِ حَسَنَةً وَقِنَا عَذَابَ ٱلنَّارِ [٢٠١]",
    ru: "Но среди них есть такие, которые говорят: «Господь наш! Одари нас добром в этом мире и добром в Последней жизни и защити нас от мучений в Огне»." },
  { ref: "аль-Ахзаб, 56",
    ar: "إِنَّ ٱللَّهَ وَمَلَـٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا [٥٦]",
    ru: "Воистину, Аллах и Его ангелы благословляют Пророка. О те, которые уверовали! Благословляйте его и приветствуйте миром." },
  { ref: "аль-Мунафикун, 9",
    ar: "يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُلْهِكُمْ أَمْوَٰلُكُمْ وَلَآ أَوْلَـٰدُكُمْ عَن ذِكْرِ ٱللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْخَـٰسِرُونَ [٩]",
    ru: "О те, которые уверовали! Пусть ваше имущество и ваши дети не отвлекают вас от поминания Аллаха. А те, которые поступают таким образом, окажутся потерпевшими убыток." },
  { ref: "аль-Ан'ам, 162–163",
    ar: "قُلْ إِنَّ صَلَاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ [١٦٢] لَا شَرِيكَ لَهُۥ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا۠ أَوَّلُ ٱلْمُسْلِمِينَ [١٦٣]",
    ru: "Скажи: «Воистину, мой намаз и мое жертвоприношение (или поклонение), моя жизнь и моя смерть посвящены Аллаху, Господу миров. Нет у Него сотоварищей. Это мне велено, и я - первый из мусульман»." },
  { ref: "аль-Бакара, 45",
    ar: "وَٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلْخَـٰشِعِينَ [٤٥]",
    ru: "Обратитесь за помощью к терпению и намазу. Воистину, намаз является тяжким бременем для всех, кроме смиренных." },
  { ref: "аш-Шура, 19",
    ar: "ٱللَّهُ لَطِيفٌۢ بِعِبَادِهِۦ يَرْزُقُ مَن يَشَآءُ ۖ وَهُوَ ٱلْقَوِىُّ ٱلْعَزِيزُ [١٩]",
    ru: "Аллах добр к Своим рабам и наделяет уделом, кого пожелает. Он - Всесильный, Могущественный." },
  { ref: "Али 'Имран, 173",
    ar: "ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَـٰنًا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ [١٧٣]",
    ru: "Люди сказали им: «Народ собрался против вас. Побойтесь же их». Однако это лишь приумножило их веру, и они сказали: «Нам достаточно Аллаха, и как прекрасен этот Попечитель и Хранитель!»." },
  { ref: "Али 'Имран, 191",
    ar: "ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَـٰمًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَـٰذَا بَـٰطِلًا سُبْحَـٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ [١٩١]",
    ru: "Которые поминают Аллаха стоя, сидя и на боку и размышляют о сотворении небес и земли: «Господь наш! Ты не сотворил это понапрасну. Пречист Ты! Защити же нас от мучений в Огне»." },
  { ref: "Худ, 115",
    ar: "وَٱصْبِرْ فَإِنَّ ٱللَّهَ لَا يُضِيعُ أَجْرَ ٱلْمُحْسِنِينَ [١١٥]",
    ru: "Терпи, ибо Аллах не теряет вознаграждения творящих добро." },
  { ref: "Али 'Имран, 31",
    ar: "قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَٱللَّهُ غَفُورٌ رَّحِيمٌ [٣١]",
    ru: "Скажи: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас и простит вам ваши грехи, ведь Аллах - Прощающий, Милосердный»." },
  { ref: "ат-Таляк, 3",
    ar: "وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥٓ ۚ إِنَّ ٱللَّهَ بَـٰلِغُ أَمْرِهِۦ ۚ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍ قَدْرًا [٣]",
    ru: "И наделяет его уделом оттуда, откуда он даже не предполагает. Тому, кто уповает на Аллаха, достаточно Его. Аллах доводит до конца Свое дело. Аллах установил меру для каждой вещи." },
  { ref: "аль-'Анкабут, 45",
    ar: "ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَـٰبِ وَأَقِمِ ٱلصَّلَوٰةَ ۖ إِنَّ ٱلصَّلَوٰةَ تَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ ۗ وَلَذِكْرُ ٱللَّهِ أَكْبَرُ ۗ وَٱللَّهُ يَعْلَمُ مَا تَصْنَعُونَ [٤٥]",
    ru: "Читай то, что внушено тебе из Писания, и совершай намаз. Воистину, намаз оберегает от мерзости и предосудительного. Но поминание Аллаха - гораздо важнее, и Аллах знает о том, что вы творите." },
  { ref: "аз-Зумар, 10",
    ar: "قُلْ يَـٰعِبَادِ ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ رَبَّكُمْ ۚ لِلَّذِينَ أَحْسَنُوا۟ فِى هَـٰذِهِ ٱلدُّنْيَا حَسَنَةٌ ۗ وَأَرْضُ ٱللَّهِ وَٰسِعَةٌ ۗ إِنَّمَا يُوَفَّى ٱلصَّـٰبِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ [١٠]",
    ru: "Скажи Моим рабам, которые уверовали: «Бойтесь вашего Господа! Тем, которые совершили добро в этом мире, уготовано добро. Земля Аллаха обширна. Воистину, терпеливым их награда воздастся полностью без счета»." },
  { ref: "аль-Кахф, 46",
    ar: "ٱلْمَالُ وَٱلْبَنُونَ زِينَةُ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَٱلْبَـٰقِيَـٰتُ ٱلصَّـٰلِحَـٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا [٤٦]",
    ru: "Богатство и сыновья - украшение мирской жизни, однако нетленные благодеяния лучше по вознаграждению перед твоим Господом, и на них лучше возлагать надежды." },
  { ref: "Та Ха, 114",
    ar: "فَتَعَـٰلَى ٱللَّهُ ٱلْمَلِكُ ٱلْحَقُّ ۗ وَلَا تَعْجَلْ بِٱلْقُرْءَانِ مِن قَبْلِ أَن يُقْضَىٰٓ إِلَيْكَ وَحْيُهُۥ ۖ وَقُل رَّبِّ زِدْنِى عِلْمًا [١١٤]",
    ru: "Превыше всего Аллах, Истинный Царь! Не торопись читать Коран, пока ниспослание откровения тебе не будет завершено, и говори: «Господи! Приумножь мои знания»." },
  { ref: "аль-Фуркан, 74",
    ar: "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّـٰتِنَا قُرَّةَ أَعْيُنٍ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا [٧٤]",
    ru: "Они говорят: «Господь наш! Даруй нам отраду глаз в наших супругах и потомках и сделай нас образцом для богобоязненных»." },
  { ref: "аль-Исра, 24",
    ar: "وَٱخْفِضْ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحْمَةِ وَقُل رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا [٢٤]",
    ru: "Склони пред ними крыло смирения по милосердию своему и говори: «Господи! Помилуй их, ведь они растили меня ребенком»." },
  { ref: "Ибрахим, 40–41",
    ar: "رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ [٤٠] رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ [٤١]",
    ru: "Господи! Включи меня и часть моего потомства в число тех, кто совершает намаз. Господь наш! Прими мою мольбу. Господь наш! Прости меня, моих родителей и верующих в тот день, когда будет представлен счет." },
  { ref: "аль-Хашр, 22",
    ar: "هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَـٰهَ إِلَّا هُوَ ۖ عَـٰلِمُ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ ۖ هُوَ ٱلرَّحْمَـٰنُ ٱلرَّحِيمُ [٢٢]",
    ru: "Он - Аллах, и нет божества, кроме Него, Ведающего сокровенное и явное. Он - Милостивый, Милосердный." },
  { ref: "аль-Му'минун, 118",

/* ================================================================
   2. СОСТОЯНИЕ
   ================================================================ */
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

// Ключ хранения — сегодняшняя дата по МЕСТНОМУ времени телефона, например "azkar-2026-10-06".
// Новый день → новый ключ → счётчики сами начинаются с нуля.
// (toISOString() тут не годится: он берёт дату по Гринвичу, и в Москве день менялся бы в 3 часа ночи)
function todayKey() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `azkar-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
let KEY = todayKey();
let counts = load(KEY, {});

// Если наступил новый день, пока приложение было открыто, — переключаемся на новый ключ
function checkNewDay() {
  if (todayKey() === KEY) return false;
  KEY = todayKey();
  counts = load(KEY, {});
  cleanOldDays();
  return true;
}

// Удаляем счётчики прошлых дней, чтобы память браузера не копила их годами
function cleanOldDays() {
  try {
    for (let k = localStorage.length - 1; k >= 0; k--) {
      const name = localStorage.key(k);
      if (/^azkar-\d{4}-\d{2}-\d{2}$/.test(name) && name !== KEY) localStorage.removeItem(name);
    }
  } catch (e) {}
}
cleanOldDays();
let time = "morning";              // какие азкары открыты сейчас
let index = 0;                     // номер текущей карточки
let items = [];                    // азкары выбранного времени
const ckey = z => time + ":" + z.id;
let mode = load("azkar-mode", "cards");
// Набор: "main" — основные, "full" — полные (основные + отмеченные full: true)
let azkarSet = load("azkar-set", "main") === "full" ? "full" : "main";
// «Полные» = все «Основные» + азкары с full: true, в порядке из видео Майрбека.
// Одинаковые азкары — одна и та же запись (тот же текст, источник и прогресс счётчика).
// Исключение: «Ля иляха илля-Ллах» — в полных 100 раз (f-14, тот же текст и источник), в основных 10.
const FULL_ORDER = {
  morning: ["m-ikhlas", "m-falaq", "m-nas", "m-sayyid", "m-adada", "m-hasbi", "m-bismillah", "m-radiitu", "m-bika",
            "m-hayyu", "m-fitra", "m-asbahna", "m-alim", "f-14", "m-subhan100",
            "m-kursi", "f-17", "f-18", "f-19", "f-20", "f-21", "m-afiya"],
  // вечер: e-bika и e-alim в видео нет, но они в «Основных» — стоят там же, где в утренних.
  // f-19…f-21 — те же записи, что утром (текст в видео тот же), прогресс у вечера свой
  evening: ["e-ikhlas", "e-falaq", "e-nas", "e-sayyid", "e-hasbi", "e-bismillah", "e-radiitu", "e-bika",
            "fe-ushhiduka", "e-hayyu", "fe-maamsa", "e-alim", "fe-tahlil100", "e-subhan100",
            "e-kursi", "fe-baqara285", "fe-baqara286", "f-19", "f-20", "f-21", "e-amsayna", "e-kalimat", "e-afiya"],
};
function setItems(t) {
  if (azkarSet === "full" && FULL_ORDER[t]) return FULL_ORDER[t].map(id => AZKAR.find(z => z.id === id));
  return AZKAR.filter(z => z.when.includes(t) && !z.full);
}
// «азкар» по-русски: 1 азкар, 2 азкара, 5 азкаров
const plural = n => n % 10 === 1 && n % 100 !== 11 ? "азкар" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "азкара" : "азкаров";   // вид чтения: "cards" — по одному, "list" — списком
// что показывать в азкарах; по умолчанию всё включено
let show = Object.assign({ ar: true, ru: true, tr: true }, load("azkar-show", {}));


/* Отметки на главной: прочитаны ли сегодня все утренние / все вечерние азкары */
function updateHome() {
  checkNewDay();   // если день сменился — отметки должны пропасть
  renderAyah();   // в полночь — новый аят
  for (const t of ["morning", "evening"]) {
    const all = setItems(t);
    const done = all.every(z => (counts[t + ":" + z.id] || 0) >= z.times);
    const btn = document.getElementById("go-" + t);
    btn.classList.toggle("done", done);
    btn.setAttribute("aria-label", (t === "morning" ? "Утренние" : "Вечерние") + " азкары" + (done ? " — прочитаны сегодня" : ""));
  }
}

/* Аят дня. Номер дня считаем по МЕСТНОЙ дате телефона (как и счётчики),
   поэтому у всех в один день один аят, и он сам меняется в полночь — без интернета */
function dayNumber(d = new Date()) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function ayahOfDay(d) { return AYAT[dayNumber(d) % AYAT.length]; }
function renderAyah() {
  const a = ayahOfDay(), box = document.getElementById("ayah-day");
  if (box.dataset.ref === a.ref) return;   // тот же аят — ничего не перерисовываем
  box.dataset.ref = a.ref;
  document.getElementById("ayah-ar").innerHTML = arabic(a.ar);
  document.getElementById("ayah-ru").textContent = a.ru;
  document.getElementById("ayah-ref").textContent = "Сура " + a.ref;
  box.setAttribute("aria-expanded", "false");
}
document.getElementById("ayah-day").addEventListener("click", e => {
  const box = e.currentTarget;
  box.setAttribute("aria-expanded", box.getAttribute("aria-expanded") === "true" ? "false" : "true");
});

/* Переключатель «Основные | Полные» на главной */
function renderSet(animate) {
  document.getElementById("set-switch").dataset.set = azkarSet;
  document.querySelectorAll(".set-opt").forEach(o => o.setAttribute("aria-checked", o.dataset.set === azkarSet ? "true" : "false"));
  for (const t of ["morning", "evening"]) {
    const el = document.getElementById("count-" + t), n = setItems(t).length;
    el.textContent = `${n} ${plural(n)}`;
    if (animate) { el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); }
  }
}
document.querySelectorAll(".set-opt").forEach(o => o.addEventListener("click", () => {
  if (o.dataset.set === azkarSet) return;
  azkarSet = o.dataset.set;

  updateHome();   // галочка «прочитано» зависит от набора

/* Переключение экранов: показываем один, остальные прячем */
function showScreen(id) {
  for (const el of document.querySelectorAll(".screen")) el.hidden = el.id !== id;
  const screen = document.getElementById(id);
  screen.scrollTop = 0;
  // перезапускаем анимацию появления: убрали класс → браузер «забыл» → добавили снова
  screen.classList.remove("enter");
  void screen.offsetWidth;
  screen.classList.add("enter");
  // Когда анимация закончилась, снимаем её полностью — так iPhone рисует текст заново, чётко
  clearTimeout(screen._enterTimer);
  screen._enterTimer = setTimeout(() => screen.classList.remove("enter"), 900);
  // Нижняя панель видна везде, кроме чтения азкаров: там внизу счётчик
  const tabbar = document.getElementById("tabbar");
  tabbar.classList.toggle("away", id === "reader");
  document.getElementById("tab-veil").classList.toggle("away", id === "reader");
  if (id === "home") updateHome();
  if (id === "duas") renderDuas();
  document.getElementById("toast").classList.remove("show");   // подсказка не переезжает на другой экран
  // чтение азкаров относится к «Главной», страница темы дуа — к «Дуа»
  const tab = id === "reader" ? "home" : id === "dua-read" ? "duas" : id;
  tabbar.dataset.active = tab;   // по этому атрибуту подложка переезжает на нужную вкладку
  document.querySelectorAll(".tab-item").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.screen === tab ? "true" : "false"));
}
document.querySelectorAll(".tab-item").forEach(t =>
  t.addEventListener("click", () => showScreen(t.dataset.screen)));

/* Настройки */
const MODE_NAMES = { cards: "По одному", list: "Списком" };
// Тема: "light", "dark" или "system" (как в телефоне). По умолчанию — как в системе
const THEME_NAMES = { light: "Светлая", dark: "Тёмная", system: "Как в системе" };
let theme = load("azkar-theme", "system");
const systemDark = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const dark = theme === "dark" || (theme === "system" && systemDark.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  // цвет полосы браузера и строки состояния — под цвет фона
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = dark ? "#0e1310" : "#ffffff");
}
// телефон сам переключил тему (например, вечером по расписанию) — переключаемся и мы
systemDark.addEventListener("change", () => { if (theme === "system") applyTheme(); });
// Размер текста: множители для арабского (ar) и для перевода с транскрипцией (tx). 1 = обычный
let size = Object.assign({ ar: 1, tx: 1 }, load("azkar-size", {}));
const pct = k => Math.round(k * 100) + "%";

function renderSettings() {
  // переключатели
  for (const key of ["ar", "ru", "tr"]) {
    document.getElementById("sw-" + key).setAttribute("aria-checked", show[key] ? "true" : "false");
    document.body.classList.toggle("no-" + key, !show[key]);   // CSS по этому классу прячет часть текста
  }
  // вид чтения
  document.getElementById("mode-value").textContent = MODE_NAMES[mode];
  applyTheme();
  document.getElementById("theme-value").textContent = THEME_NAMES[theme];
  document.querySelectorAll(".choice-row[data-theme-choice]").forEach(o =>
    o.setAttribute("aria-checked", o.dataset.themeChoice === theme ? "true" : "false"));
  // размер текста: множители на <html> — их подхватывают все азкары и образец в окне
  const root = document.documentElement.style;
  root.setProperty("--ar-k", size.ar);
  root.setProperty("--tx-k", size.tx);
  document.getElementById("size-value").textContent =
    size.ar === 1 && size.tx === 1 ? "Обычный" : size.ar === size.tx ? pct(size.ar) : `${pct(size.ar)} · ${pct(size.tx)}`;
  for (const key of ["ar", "tx"]) {
    const r = document.getElementById("size-" + key);
    r.value = size[key];
    r.style.setProperty("--p", (size[key] - r.min) / (r.max - r.min) * 100 + "%");   // зелёная часть дорожки
    document.getElementById(`size-${key}-out`).textContent = pct(size[key]);
  }
  document.getElementById("size-reset").disabled = size.ar === 1 && size.tx === 1;
  document.querySelectorAll(".choice-row[data-mode]").forEach(o =>
    o.setAttribute("aria-checked", o.dataset.mode === mode ? "true" : "false"));
}

document.querySelectorAll(".switch").forEach(sw => sw.addEventListener("click", () => {
  show[sw.dataset.key] = !show[sw.dataset.key];
  store("azkar-show", show);
  renderSettings();
}));

// Закрыть выезжающее окно: сначала анимация ухода, потом прячем
function closeSheet(el = sheet) {
  el.classList.add("closing");
  setTimeout(() => { el.hidden = true; el.classList.remove("closing"); }, 220);
}
/* Любое выезжающее окно можно смахнуть пальцем вниз, как в iOS.
   Окно едет за пальцем; отпустили ниже трети высоты или смахнули быстро — закрывается, иначе возвращается.
   Не мешаем ползункам размера текста и прокрутке длинных списков внутри окна */
function closeSheetFrom(back, el) {
  el.style.transition = "transform .22s cubic-bezier(.3, .7, .3, 1)";
  el.style.transform = "translateY(100%)";
  back.classList.add("closing-drag");
  setTimeout(() => { back.hidden = true; back.classList.remove("closing-drag"); el.style.transition = el.style.transform = ""; }, 220);
}
document.querySelectorAll(".sheet-back").forEach(back => {
  const el = back.querySelector(".sheet");
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false;
  el.addEventListener("touchstart", e => {
    const tgt = e.target;
    if (e.touches.length !== 1 || tgt.closest("input[type=range], input[type=search]")) { y0 = null; return; }
    const list = tgt.closest(".sheet-list, #city-list");
    if (list && list.scrollTop > 0) { y0 = null; return; }   // список прокручен — сначала он едет вверх
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const ny = e.touches[0].clientY - y0, nx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (Math.abs(nx) > Math.abs(ny) || ny < 6) { if (ny < -6 || Math.abs(nx) > 10) y0 = null; return; }
      dragging = true; el.style.transition = "none";
    }
    dy = Math.max(0, ny);
    el.style.transform = `translateY(${dy}px)`;
    if (e.cancelable) e.preventDefault();   // пока тянем окно, страница под ним не прокручивается
  }, { passive: false });
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (!dragging) return;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    if (dy > el.offsetHeight / 3 || (fast && dy > 30)) closeSheetFrom(back, el);
    else { el.style.transition = "transform .25s cubic-bezier(.3, .7, .3, 1)"; el.style.transform = ""; setTimeout(() => { el.style.transition = ""; }, 260); }
  };
  el.addEventListener("touchend", end);
  el.addEventListener("touchcancel", end);
});

const sheet = document.getElementById("mode-sheet");
document.getElementById("open-mode").addEventListener("click", () => { sheet.hidden = false; });
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });   // нажали мимо окна — закрыть

/* ================================================================
   3. ВЫБОР: утренние или вечерние
   ================================================================ */
function openTime(t) {
  checkNewDay();
  time = t;
  items = setItems(time);
  // начинаем с первого непрочитанного зикра
  index = items.findIndex(z => (counts[ckey(z)] || 0) < z.times);
  if (index === -1) index = items.length;          // всё прочитано → сразу финальная карточка
  const cards = mode === "cards";
  document.getElementById("viewport").hidden = !cards;
  document.getElementById("list-view").hidden = cards;
  showScreen("reader");
  // Очищаем неиспользуемый вид. Иначе на странице остаются невидимые карточки
  // со счётчиками с теми же id, и программа обновляет их вместо видимых
  document.getElementById(cards ? "list-view" : "track").innerHTML = "";
  if (cards) { buildSlides(); goTo(index, false); }
  else { buildList(); updatePos(); }
}
document.getElementById("go-morning").addEventListener("click", () => openTime("morning"));
document.getElementById("go-evening").addEventListener("click", () => openTime("evening"));

/* Экран «Дуа»: группы тем, как настройки iPhone. Поиск — по названию темы и по тексту дуа */
const low = x => (x || "").toLowerCase().replace(/ё/g, "е");
// Избранные дуа — список id, хранится на телефоне

function renderDuas() {
  const q = low(document.getElementById("dua-search").value.trim());

    c.items.some(z => low(z.title).includes(q) || low(z.ru).includes(q) || low(z.tr).includes(q) || low(z.how).includes(q));
  let html = "", k = 0;
  // «Избранное» — сверху, когда там что-то есть и ничего не ищем
  const fav = favCat();
  if (!q && fav.items.length) html += `<div class="group" style="--i:${k++}"><div class="rows">${catRow(fav)}</div></div>`;
  for (const g of DUA_GROUPS) {
    const cats = g.cats.filter(c => match(c) || (q && low(g.title).includes(q)));
    if (!cats.length) continue;
    html += `<div class="group" style="--i:${k++}"><span class="group-title">${g.title}</span><div class="rows">` +
      cats.map(catRow).join("") + `</div></div>`;
  }
  const box = document.getElementById("dua-groups");
  box.innerHTML = html || `<p class="dua-empty">Ничего не найдено</p>`;
  box.querySelectorAll(".dua-row:not(.soon)").forEach(r =>
    r.addEventListener("click", () => openDua(r.dataset.cat)));
}
document.getElementById("dua-search").addEventListener("input", renderDuas);

/* Страница темы: карточки дуа (номер и название, арабский, перевод, транскрипция — сворачивается,

  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',

      <div class="dua-foot">

// Текст для копирования и «поделиться»: всё, что на карточке
function duaText(z) {
  return [z.title, z.how, z.ar, [z.ru, z.tr].filter(Boolean).join("\n"), "Источник: " + z.src].filter(Boolean).join("\n\n");
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  // запасной способ для старых браузеров
  const a = document.createElement("textarea"); a.value = text; a.setAttribute("readonly", "");
  a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  a.remove(); return ok;
}
document.getElementById("dua-cards").addEventListener("click", async e => {
  const b = e.target.closest(".dua-act"); if (!b) return;
  const z = DUA_ALL.find(x => x.id === b.closest(".dua-card").dataset.id);
  if (b.dataset.act === "copy") toast(await copyText(duaText(z)) ? "Скопировано" : "Не получилось скопировать");
  if (b.dataset.act === "share") {
    // меню «Поделиться» телефона; если его нет (компьютер) — просто копируем
    if (navigator.share) { try { await navigator.share({ text: duaText(z) }); } catch (err) {} }
    else toast(await copyText(duaText(z)) ? "Скопировано — можно вставить в сообщение" : "Не получилось скопировать");
  }
  if (b.dataset.act === "fav") {
    const on = !favs.includes(z.id);
    favs = on ? [...favs, z.id] : favs.filter(id => id !== z.id);
    store("azkar-dua-fav", favs);
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    favBurst(b, on);
    haptic(on ? "done" : "tap");
    toast(on ? "Добавлено в избранное" : "Убрано из избранного");

  }
});
document.getElementById("dua-back").addEventListener("click", () => showScreen("duas"));

// Анимация звезды: класс перезапускаем (убрали → браузер «забыл» → добавили), кольцо и 8 искорок
// создаём на время анимации и потом удаляем
function favBurst(b, on) {
  b.classList.remove("pop", "unpop"); void b.offsetWidth;
  b.classList.add(on ? "pop" : "unpop");
  if (!on) return;
  const parts = [Object.assign(document.createElement("i"), { className: "fav-ring" })];
  const colors = ["#ff9500", "#ffcc00", "#34c759", "#ff9500"];
  for (let k = 0; k < 8; k++) {
    const sp = document.createElement("i");
    sp.className = "fav-spark";
    sp.style.setProperty("--a", k * 45 + 22 + "deg");   // восемь лучей по кругу
    sp.style.setProperty("--c", colors[k % colors.length]);
    parts.push(sp);
  }
  parts.forEach(x => b.appendChild(x));
  setTimeout(() => parts.forEach(x => x.remove()), 700);
}
