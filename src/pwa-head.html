<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- Чтобы на iPhone открывалось как приложение, без адресной строки -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Азкары">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Отступ под «чёлку» сверху. Снизу общего отступа нет: экраны доходят до края,
     а под полоску «домой» отступают сами (панель со счётчиком, нижнее меню) */
  html { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; height: 100%; }
  body { margin: 0; -webkit-text-size-adjust: 100%; }
  img { max-width: 100%; }
</style>
