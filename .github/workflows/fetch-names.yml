# Скачивает исходники для «99 имён Аллаха» (tools/fetch_names.py) и сохраняет их в эту же ветку.
# Запускается только пушем в служебную ветку names-fetch.
name: fetch-names
on:
  push:
    branches: [names-fetch]
    paths: [tools/fetch_names.py, tools/names-src/ayahs.txt, .github/workflows/fetch-names.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_names.py
      - name: Сохранить в ветку
        if: always()
        run: |
          git config user.name "MAYRCOD"
          git config user.email "MAYRCOD@users.noreply.github.com"
          git add -A tools/names-src
          git commit -m "99 имён: исходники (ат-Тирмизи 3507, ас-Саади и Кулиев с quran.com; скачано tools/fetch_names.py)"
          git push || true
