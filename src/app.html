/* ================================================================
   4. КАРТОЧКИ
   ================================================================ */
// В шрифте Hafs арабская запятая «،» нарисована как кружок,
// поэтому показываем её обычным шрифтом
// Подготовка арабского текста к показу. Сами данные не меняем — только то, как они выглядят
function arabic(text) {
  return text
    // 1. Номер аята «[١]» → «١»: шрифт Hafs сам рисует номер в узорном кружке, скобки не нужны
    .replace(/\[([\u0660-\u0669]+)\]/g, '$1')
    // 1а. Сукун. В мусхафе Медины он похож на головку буквы «х» (ۡ), а не на кружок.
    //     В тексте (как у quran.com) сукун записан обычным знаком U+0652, а шрифт Hafs
    //     рисует его кружком. Поэтому показываем мусхафный сукун U+06E1.
    .replace(/\u0652/g, '\u06E1')
    // 1б. Знак немого алифа (U+06DF) браузер рисует кляксой ◉. Показываем его кружком U+0652:
    //     в мусхафе над непроизносимыми буквами как раз пустой кружок.
    //     Порядок важен: сначала 1а, иначе этот кружок тоже превратился бы в сукун
    .replace(/\u06DF/g, '\u0652')
    // 2. Икляб: танвин + маленький мим. В мусхафе Медины (под него сделан шрифт) здесь пишут
    //    одну огласовку + мим, иначе мим наезжает на танвин: «ٌۢ» → «ُۢ», «ًۢ» → «َۢ», «ٍۭ» → «ِۭ»
    .replace(/\u064C\u06E2/g, '\u064F\u06E2')
    .replace(/\u064B\u06E2/g, '\u064E\u06E2')
    .replace(/\u064D\u06ED/g, '\u0650\u06ED')
    // 3. Номер аята не должен отрываться от последнего слова и уезжать на новую строку
    .replace(/(\S+) ([\u0660-\u0669]+)/g, '<span class="nowrap">$1 $2</span>')
    // 4. Запятая «،»: неразрывный пробел перед ней, чтобы она не уезжала в начало строки,
    //    и обычный шрифт, потому что в шрифте Hafs она нарисована кружком
    .replace(/ ،/g, '\u00A0،')
    .replace(/،/g, '<span class="ar-comma">،</span>')
    // 5. Перенос строки (после басмалы)
    .replace(/\n/g, '<br>');
}

// Кнопка-счётчик одинаковая в обоих видах
function counterHTML(i) {
  return `<button class="counter" id="counter-${i}">
      <i class="fill"></i><span class="label"></span><span class="num"></span>
    </button>`;
}
function contentHTML(z) {
  return `<div class="content">
      <p class="ar" lang="ar">${arabic(z.ar)}</p>
      <div class="divider"></div>
      <p class="ru">${z.ru}</p>
      ${z.tr ? `<p class="tr">${z.tr}</p>` : ""}
      <p class="src">Источник: ${z.src}</p>
    </div>`;
}
function finalHTML() {
  return `<div class="final">
      <h2>${time === "morning" ? "Утренние" : "Вечерние"} азкары прочитаны</h2>
      <div class="actions">
        <button class="btn to-home">На главную</button>
      </div>
    </div>`;
}

/* Вид «Списком»: все азкары друг под другом, у каждого свой счётчик */
function buildList() {
  const box = document.getElementById("list-view");
  box.innerHTML = items.map((z, i) => `
    <section class="item" id="item-${i}">
      ${contentHTML(z)}
      ${counterHTML(i)}
    </section>`).join("") + finalHTML();
  items.forEach((z, i) => {
    document.getElementById("counter-" + i).addEventListener("click", () => tap(i));
    updateCounter(i);
  });
  box.querySelector(".to-home").addEventListener("click", () => showScreen("home"));
  // открываем на первом непрочитанном (если всё прочитано — в самом конце)
  box.scrollTop = 0;
  if (index >= items.length) box.scrollTop = box.scrollHeight;
  else if (index > 0) box.scrollTop = document.getElementById("item-" + index).offsetTop - box.offsetTop;
}

/* Вид «По одному»: карточки в ряд, листаются свайпом */
function buildSlides() {
  const track = document.getElementById("track");
  track.innerHTML = "";
  items.forEach((z, i) => {
    const slide = document.createElement("section");
    slide.className = "slide";
    slide.innerHTML = `<div class="scroll">
      ${contentHTML(z)}
      <div class="dock">
        ${counterHTML(i)}
        <p class="hint">Проведите влево или вправо, чтобы перейти</p>
      </div>
    </div>`;
    slide.querySelector(".counter").addEventListener("click", () => tap(i));
    track.appendChild(slide);
    updateCounter(i);
  });

  // последняя карточка — «готово»
  const final = document.createElement("section");
  final.className = "slide";
  final.innerHTML = finalHTML();
  final.querySelector(".to-home").addEventListener("click", () => showScreen("home"));
  track.appendChild(final);
}

function updateCounter(i) {
  const z = items[i];
  const n = counts[ckey(z)] || 0;
  const btn = document.getElementById("counter-" + i);
  const full = n >= z.times;
  btn.classList.toggle("full", full);
  btn.querySelector(".fill").style.transform = `scaleX(${n / z.times})`;
  btn.querySelector(".label").textContent = full ? "Прочитано ✓" : "";   // пока читаешь — только цифры
  btn.querySelector(".num").textContent = `${n} / ${z.times}`;
}

function tap(i) {
  if (justSwiped) return;                         // палец ехал по экрану — это свайп, а не нажатие
  const z = items[i];
  const n = counts[ckey(z)] || 0;
  if (n >= z.times) { if (mode === "cards") goTo(i + 1); return; }   // уже прочитан
  counts[ckey(z)] = n + 1;
  store(KEY, counts);
  updateCounter(i);
  if (n + 1 < z.times) haptic("tap");   // на последнем нажатии — вибрация «дочитан» ниже
  const num = document.querySelector("#counter-" + i + " .num");
  num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump");
  if (mode === "list") updatePos();
  if (n + 1 === z.times) {
    haptic("done");
    // небольшая пауза, чтобы увидеть «Прочитано», потом к следующему
    if (mode === "cards") setTimeout(() => { if (index === i) goTo(i + 1); }, 600);
    else setTimeout(() => {
      const next = document.getElementById("item-" + (i + 1)) || document.querySelector("#list-view .final");
      next.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 600);
  }
}

function updatePos() {
  const done = items.filter(z => (counts[ckey(z)] || 0) >= z.times).length;
  document.getElementById("pos").textContent = `Прочитано ${done} из ${items.length}`;
}

function goTo(i, animate = true) {
  index = Math.max(0, Math.min(items.length, i));
  const track = document.getElementById("track");
  if (animate) {
    track.classList.remove("dragging");
    track.style.transform = `translate3d(${-index * 100}%, 0, 0)`;
  } else {
    // мгновенно, без анимации: на миг выключаем плавность, ставим ленту и включаем обратно
    track.classList.add("dragging");
    track.style.transform = `translate3d(${-index * 100}%, 0, 0)`;
    void track.offsetWidth;
    track.classList.remove("dragging");
  }
  [...track.children].forEach((sl, k) => {
    sl.classList.toggle("active", k === index);
    sl.classList.toggle("far", Math.abs(k - index) > 1);   // видны текущая и соседние
  });
  document.getElementById("pos").textContent =
    index < items.length ? `${index + 1} из ${items.length}` : "Готово";
}

/* ================================================================
   5. СВАЙП. Запоминаем, где палец коснулся экрана, и смотрим,
   куда он уехал. Влево больше чем на 60px — следующий зикр,
   вправо — предыдущий. Вертикальное движение оставляем браузеру
   для прокрутки длинного текста.
   ================================================================ */
const viewport = document.getElementById("viewport");
const track = document.getElementById("track");
let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, justSwiped = false;
let lastX = 0, lastT = 0, speed = 0, frame = 0, width = 0;

viewport.addEventListener("pointerdown", e => {
  startX = lastX = e.clientX; startY = e.clientY; lastT = e.timeStamp;
  dx = 0; speed = 0; dragging = true; decided = false; justSwiped = false;
  width = viewport.clientWidth;
});
viewport.addEventListener("pointermove", e => {
  if (!dragging) return;
  const mx = e.clientX - startX, my = e.clientY - startY;
  if (!decided) {
    if (Math.abs(mx) + Math.abs(my) < 10) return;
    decided = true;
    if (Math.abs(my) > Math.abs(mx)) { dragging = false; return; }   // это прокрутка вниз/вверх
    justSwiped = true;
    startX = e.clientX;                     // отсчёт с этого места — карточка трогается плавно, без скачка
    track.classList.add("dragging");
  }
  dx = e.clientX - startX;
  // у первой и последней карточки — «резинка»: тянется втрое туже
  if ((index === 0 && dx > 0) || (index === items.length && dx < 0)) dx /= 3;
  // скорость пальца (пикселей в миллисекунду) — для быстрого смаха
  const dt = e.timeStamp - lastT;
  if (dt > 0) speed = 0.8 * ((e.clientX - lastX) / dt) + 0.2 * speed;
  lastX = e.clientX; lastT = e.timeStamp;
  // двигаем ленту не чаще, чем экран рисует кадры
  if (!frame) frame = requestAnimationFrame(() => {
    frame = 0;
    track.style.transform = `translate3d(${-index * width + dx}px, 0, 0)`;
  });
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (!decided) return;
  cancelAnimationFrame(frame); frame = 0;
  // перелистываем, если протащили на пятую часть экрана или быстро смахнули
  if (dx < -width * 0.2 || (speed < -0.4 && dx < 0)) goTo(index + 1);
  else if (dx > width * 0.2 || (speed > 0.4 && dx > 0)) goTo(index - 1);
  else goTo(index);
  setTimeout(() => { justSwiped = false; }, 50);
}
viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
// При повороте экрана ширина меняется — ставим ленту ровно
window.addEventListener("resize", () => { if (!document.getElementById("reader").hidden && mode === "cards") goTo(index, false); });

// На компьютере можно листать стрелками на клавиатуре
document.addEventListener("keydown", e => {
  if (document.getElementById("reader").hidden || mode !== "cards") return;
  if (e.key === "ArrowLeft") goTo(index - 1);
  if (e.key === "ArrowRight") goTo(index + 1);
});

/* ================================================================
   6. СЧЁТЧИК (ТАСБИХ). Три независимых счётчика, у каждого своё число.
   Нажатие в любом месте средней части экрана прибавляет один.
   Числа сохраняются в памяти телефона и не обнуляются в полночь —
   только кнопкой сброса.
   ================================================================ */
let tb = Object.assign({ active: 0, values: [0, 0, 0] }, load("azkar-counter", {}));

// Лёгкий «щелчок» под пальцем. На Android есть navigator.vibrate.
// Safari на iPhone его не умеет, но с iOS 18 даёт щелчок при нажатии на переключатель
// <input type="checkbox" switch> — им и пользуемся: нажимаем невидимый переключатель программно
const hapticLabel = (() => {
  const label = document.createElement("label");
  label.style.display = "none"; label.setAttribute("aria-hidden", "true");
  const input = document.createElement("input");
  input.type = "checkbox"; input.setAttribute("switch", "");
  label.appendChild(input); document.body.appendChild(label);
  return label;
})();
// В приложении для iPhone — системная вибрация (плагин Capacitor Haptics), самая лёгкая:
//   "tap"  — каждое нажатие счётчика: короткий мягкий «тук» (ImpactStyle.Light);
//   "done" — азкар дочитан: чуть заметнее (ImpactStyle.Medium), но всё равно не резко.
// На сайте — щелчок переключателя (iOS 18) или navigator.vibrate (Android)
const HAPTICS = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
  ? window.Capacitor.Plugins.Haptics : null;
function haptic(kind = "tap") {
  if (HAPTICS) { HAPTICS.impact({ style: kind === "done" ? "MEDIUM" : "LIGHT" }).catch(() => {}); return; }
  if (navigator.vibrate) navigator.vibrate(kind === "done" ? 30 : 8);
  else hapticLabel.click();
}

function renderTasbih() {
  const n = tb.values[tb.active];
  document.getElementById("tb-num").textContent = n;
  document.getElementById("tb-hint").classList.toggle("gone", n > 0);
  document.querySelectorAll(".tb-slot").forEach(sl => {
    const k = +sl.dataset.slot;
    sl.setAttribute("aria-selected", k === tb.active ? "true" : "false");
    sl.querySelector("b").textContent = tb.values[k];
  });
}

const stage = document.getElementById("tb-tap");
stage.addEventListener("click", () => {
  tb.values[tb.active]++;
  store("azkar-counter", tb);
  // каждые 33 (33, 66, 99, …) — «тук» чуть сильнее: можно считать тасбих, не глядя на экран
  haptic(tb.values[tb.active] % 33 === 0 ? "done" : "tap");
  renderTasbih();
  const num = document.getElementById("tb-num");
  num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump");
});

document.querySelectorAll(".tb-slot").forEach(sl => sl.addEventListener("click", () => {
  tb.active = +sl.dataset.slot;
  store("azkar-counter", tb);
  renderTasbih();
}));

document.getElementById("tb-reset").addEventListener("click", () => askReset(
  `Сбросить счётчик ${tb.active + 1}?`, "Число начнётся с нуля, другие счётчики не изменятся",
  () => { tb.values[tb.active] = 0; store("azkar-counter", tb); renderTasbih(); }));

/* ================================================================
   СТАРТ
   ================================================================ */
// Запомнили, открыто ли приложение с экрана «Домой» (старые iPhone сообщают это только так)
if (navigator.standalone) document.documentElement.classList.add("standalone");
renderSettings();
renderTasbih();
showScreen("home");
</script>
