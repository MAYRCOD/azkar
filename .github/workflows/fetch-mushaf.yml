# Скачивает раскладку и шрифты всех 604 страниц мусхафа (tools/fetch_mushaf.py) и сохраняет их в эту же ветку.
# Запускается только пушем в ветку mushaf-fetch (служебная ветка для скачивания).
name: fetch-mushaf
on:
  push:
    branches: [mushaf-fetch]
    paths: [tools/fetch_mushaf.py, .github/workflows/fetch-mushaf.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_mushaf.py 1 604
      - name: Сохранить в ветку
        run: |
          git config user.name "MAYRCOD"
          git config user.email "MAYRCOD@users.noreply.github.com"
          git add src/quran-src/mushaf src/mushaf-fonts
          git commit -m "Мусхаф: раскладка 1441 и шрифты V4 всех 604 страниц (скачано tools/fetch_mushaf.py)"
          git push
