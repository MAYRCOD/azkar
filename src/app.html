      { id: "d-pr-rida", title: "Прибегаю к Твоему довольству", how: "'Аиша (да будет доволен ею Аллах) рассказала: «Однажды ночью я не нашла Посланника Аллаха (мир ему и благословение Аллаха) на постели и стала искать его. Моя рука коснулась его стоп — он был в земном поклоне, и стопы его были поставлены прямо, — и он говорил:»",
        ar: "اللَّهُمَّ أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ وَأَعُوذُ بِكَ مِنْكَ لَا أُحْصِي ثَنَاءً عَلَيْكَ أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ",
        ru: "О Аллах, я прибегаю к Твоему довольству от Твоего гнева и к Твоему прощению от Твоего наказания, и я прибегаю к Тебе от Тебя! Не счесть мне похвал Тебе — Ты таков, каким Сам Себя восхвалил.",
        tr: "Аллахумма, а'узу би-рида-кя мин сахати-к, ва би-му'афати-кя мин 'укубати-к, ва а'узу би-кя мин-к, ля ухсы сана'ан 'аляй-к, Анта кя-ма аснайта 'аля нафси-к.",
        src: "Муслим 486" },
    ] },
    { id: "pr-jalsa", name: "Между земными поклонами", tile: "purple", icon: "dome", items: [
      { id: "d-pr-rabbighfir", title: "Господь мой, прости меня", how: "Хузайфа (да будет доволен им Аллах) рассказал, что, сидя между двумя земными поклонами, Пророк (мир ему и благословение Аллаха) говорил:",
        ar: "رَبِّ اغْفِرْ لِي رَبِّ اغْفِرْ لِي",
        ru: "Господь мой, прости меня, Господь мой, прости меня!",
        tr: "Рабби-гфир ли, Рабби-гфир ли.",
        src: "Абу Дауд 874" },
      { id: "d-pr-warhamni", title: "Прости меня и помилуй меня", how: "Ибн 'Аббас (да будет доволен Аллах ими обоими) рассказал, что между двумя земными поклонами Пророк (мир ему и благословение Аллаха) говорил эти слова. Здесь они приведены полностью, как в книге «Крепость мусульманина»: разные слова — из разных передач.",
        ar: "اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَاجْبُرْنِي، وَعَافِنِي، وَارْزُقْنِي، وَارْفَعْنِي",
        ru: "О Аллах, прости меня, помилуй меня, выведи меня на правильный путь, восполни мои недостатки, избавь меня (от всего дурного), даруй мне средства к существованию и возвысь меня.",
        tr: "Аллахумма-гфир ли, ва-рхам-ни, ва-хди-ни, ва-джбур-ни, ва 'афи-ни, ва-рзук-ни, ва-рфа'-ни.",
        src: "Абу Дауд 850, ат-Тирмизи 284, Ибн Маджа 898" },
    ] },
    { id: "pr-tilawa", name: "Земной поклон при чтении Корана", tile: "orange", icon: "dome", items: [
      { id: "d-pr-t-wajhi", title: "Моё лицо склонилось перед Тем, Кто сотворил его", how: "'Аиша (да будет доволен ею Аллах) рассказала, что, совершая ночью земной поклон при чтении Корана, Пророк (мир ему и благословение Аллаха) говорил:",
        ar: "سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ\nفَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ",
        ru: "Лицо моё склонилось до земли перед Тем, кто сотворил его и наделил его слухом и зрением Своей мощью и силой.\nБлагословен же Аллах, лучший из творцов!",
        tr: "Саджада ваджхи ли-ллязи халяка-ху ва шакка сам'а-ху ва басара-ху би-хаули-хи ва куввати-х.\nФа-табаракя-Ллаху ахсану-ль-халикын.",
        src: "ат-Тирмизи 580; последние слова — аль-Хаким 1/220" },
      { id: "d-pr-t-uktub", title: "Запиши мне за него награду", how: "Ибн 'Аббас (да будет доволен им Аллах) рассказал, что Пророк (мир ему и благословение Аллаха) прочитал аят, требующий земного поклона, совершил поклон и сказал:",
        ar: "اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْرًا وَضَعْ عَنِّي بِهَا وِزْرًا وَاجْعَلْهَا لِي عِنْدَكَ ذُخْرًا وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ",
        ru: "О Аллах, запиши мне у Себя награду за него (за этот земной поклон), сними с меня за него прегрешение, сделай его для меня запасом у Себя и прими его у меня, как принял Ты его от раба Своего Давуда.",
        tr: "Аллахумма-ктуб ли би-ха 'инда-кя аджран, ва да' 'анни би-ха визран, ва-дж'аль-ха ли 'инда-кя зухран, ва такаббаль-ха минни кя-ма такаббальта-ха мин 'абди-кя Дауд.",
        src: "ат-Тирмизи 579" },
    ] },
    { id: "pr-tashahhud", name: "Ташаххуд", tile: "green", icon: "dome", items: [
      { id: "d-pr-tahiyyat", title: "Ат-тахиййату ли-Ллях", how: "Пророк (мир ему и благословение Аллаха) сказал: «Когда кто-то из вас молится, пусть скажет: …» Он сказал, что, произнося «мир нам и праведным рабам Аллаха», вы приветствуете каждого праведного раба на небе и на земле.",
        ar: "التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
        ru: "Приветствия — Аллаху, и молитвы, и лучшие слова. Мир тебе, о Пророк, и милость Аллаха и благословения Его. Мир нам и праведным рабам Аллаха. Свидетельствую, что нет бога, кроме Аллаха, и свидетельствую, что Мухаммад — Его раб и Его посланник.",
        tr: "Ат-тахиййату ли-Ллях, ва-с-салявату ва-т-таййибат, ас-саляму 'аляй-кя аййуха-н-набиййу ва рахмату-Ллахи ва баракату-х, ас-саляму 'аляй-на ва 'аля 'ибади-Лляхи-с-салихин. Ашхаду алля иляха илля-Ллах, ва ашхаду анна Мухаммадан 'абду-ху ва расулю-х.",
        src: "аль-Бухари 831" },
    ] },
    { id: "pr-salawat", name: "Салават после ташаххуда", tile: "teal", icon: "star", items: [
      { id: "d-pr-ibrahimiyya", title: "О Аллах, благослови Мухаммада", how: "Салават — мольба за Пророка (мир ему и благословение Аллаха). В молитве его читают после ташаххуда. Сподвижники спросили: «О Посланник Аллаха, как нам благословлять вас, членов твоей семьи? Ведь Аллах уже научил нас, как приветствовать вас». Он ответил: «Говорите:»",
        ar: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ، وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ، وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ، وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ",
        ru: "О Аллах, благослови Мухаммада и семейство Мухаммада, как благословил Ты Ибрахима и семейство Ибрахима, поистине, Ты — Достойный похвалы, Славный! О Аллах, пошли благословения Мухаммаду и семейству Мухаммада, как послал Ты их Ибрахиму и семейству Ибрахима, поистине, Ты — Достойный похвалы, Славный!",
        tr: "Аллахумма, салли 'аля Мухаммадин ва 'аля али Мухаммад, кя-ма салляйта 'аля Ибрахима ва 'аля али Ибрахим, инна-кя Хамидун Маджид. Аллахумма, барик 'аля Мухаммадин ва 'аля али Мухаммад, кя-ма баракта 'аля Ибрахима ва 'аля али Ибрахим, инна-кя Хамидун Маджид.",
        src: "аль-Бухари 3370" },
      { id: "d-pr-azwaj", title: "Мухаммада, его жён и потомство", how: "Люди спросили: «О Посланник Аллаха, как нам благословлять тебя?» Он (мир ему и благословение Аллаха) ответил: «Говорите:»",
        ar: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ، كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ، وَبَارِكْ عَلَى مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ، كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ",
        ru: "О Аллах, благослови Мухаммада, его жён и его потомство, как благословил Ты семейство Ибрахима, и пошли благословения Мухаммаду, его жёнам и его потомству, как послал Ты их семейству Ибрахима, поистине, Ты — Достойный похвалы, Славный!",
        tr: "Аллахумма, салли 'аля Мухаммадин ва азваджи-хи ва зуррийати-х, кя-ма салляйта 'аля али Ибрахим, ва барик 'аля Мухаммадин ва азваджи-хи ва зуррийати-х, кя-ма баракта 'аля али Ибрахим, инна-кя Хамидун Маджид.",
        src: "аль-Бухари 3369" },
    ] },
    { id: "pr-before-salam", name: "Перед саламом", tile: "red", icon: "dome", items: [
      { id: "d-pr-arba", title: "От четырёх вещей", how: "Пророк (мир ему и благословение Аллаха) сказал: «Когда кто-то из вас прочитает ташаххуд, пусть попросит у Аллаха защиты от четырёх вещей, говоря:»",
        ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ وَمِنْ عَذَابِ الْقَبْرِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ",
        ru: "О Аллах, я прибегаю к Тебе от мук ада, от мучений могилы, от искушений жизни и смерти и от зла искушения Лжемессии (Даджаля)!",
        tr: "Аллахумма, инни а'узу би-кя мин 'азаби джаханнам, ва мин 'азаби-ль-кабр, ва мин фитнати-ль-махйа ва-ль-мамат, ва мин шарри фитнати-ль-Масихи-д-Даджжаль.",
        src: "Муслим 588" },
      { id: "d-pr-maghram", title: "От греха и долга", how: "'Аиша (да будет доволен ею Аллах) рассказала, что Пророк (мир ему и благословение Аллаха) обращался в молитве с такой мольбой:",
        ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَفِتْنَةِ الْمَمَاتِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ",
        ru: "О Аллах, поистине, я прибегаю к Тебе от мучений могилы, я прибегаю к Тебе от искушения Лжемессии (Даджаля) и я прибегаю к Тебе от искушений жизни и смерти. О Аллах, поистине, я прибегаю к Тебе от греха и от долга!",
        tr: "Аллахумма, инни а'узу би-кя мин 'азаби-ль-кабр, ва а'узу би-кя мин фитнати-ль-Масихи-д-Даджжаль, ва а'узу би-кя мин фитнати-ль-махйа ва фитнати-ль-мамат. Аллахумма, инни а'узу би-кя мина-ль-ма'сами ва-ль-маграм.",
        src: "аль-Бухари 832" },
      { id: "d-pr-zulman", title: "Я много поступал несправедливо", how: "Абу Бакр (да будет доволен им Аллах) попросил Пророка (мир ему и благословение Аллаха) научить его мольбе для молитвы. Пророк сказал: «Скажи:»",
        ar: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ",
        ru: "О Аллах, поистине, я много раз обижал самого себя (то есть грешил), а никто, кроме Тебя, не прощает грехов! Прости же меня прощением от Тебя и помилуй меня, поистине, Ты — Прощающий, Милосердный!",
        tr: "Аллахумма, инни залямту нафси зульман кясиран, ва ля йагфиру-з-зунуба илля Ант, фа-гфир ли магфиратан мин 'инди-к, ва-рхам-ни, инна-кя Анта-ль-Гафуру-р-Рахим.",
        src: "аль-Бухари 834" },
      { id: "d-pr-qaddamtu", title: "Прости мне прошлое и будущее", how: "Последним, что Пророк (мир ему и благословение Аллаха) говорил между ташаххудом и саламом, было:",
        ar: "اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ وَمَا أَسْرَفْتُ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ لَا إِلَهَ إِلَّا أَنْتَ",
        ru: "О Аллах, прости мне то, что я совершил прежде и что оставил на потом, что совершил тайно и что совершил явно, то, в чём я преступил границы, и то, о чём Ты знаешь лучше меня! Ты — Выдвигающий вперёд и Ты — Отодвигающий, нет бога, кроме Тебя!",
        tr: "Аллахумма-гфир ли ма каддамту ва ма аххарт, ва ма асрарту ва ма а'лянт, ва ма асрафт, ва ма Анта а'ляму би-хи минни, Анта-ль-Мукаддиму ва Анта-ль-Му'аххир, ля иляха илля Ант.",
        src: "Муслим 771" },
      { id: "d-pr-ainni", title: "Помоги мне поминать Тебя", how: "Пророк (мир ему и благословение Аллаха) взял Му'аза за руку и сказал: «О Му'аз, клянусь Аллахом, я люблю тебя! Советую тебе, Му'аз: не оставляй после каждой молитвы слов:»",
        ar: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
        ru: "О Аллах, помоги мне поминать Тебя, благодарить Тебя и должным образом поклоняться Тебе.",
        tr: "Аллахумма, а'ин-ни 'аля зикри-кя ва шукри-кя ва хусни 'ибадати-к.",
        src: "Абу Дауд 1522" },
      { id: "d-pr-bukhl", title: "От скупости и трусости", how: "Са'д ибн Абу Ваккас (да будет доволен им Аллах) учил своих детей этим словам, как учитель учит детей письму, и говорил, что Посланник Аллаха (мир ему и благословение Аллаха) просил защиты этими словами в конце молитвы.",
        ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ",
        ru: "О Аллах, поистине, я прибегаю к Тебе от скупости, и я прибегаю к Тебе от малодушия, и я прибегаю к Тебе от того, чтобы оказаться дряхлым стариком, и я прибегаю к Тебе от искушений этого мира, и я прибегаю к Тебе от мучений могилы.",
        tr: "Аллахумма, инни а'узу би-кя мина-ль-бухль, ва а'узу би-кя мина-ль-джубн, ва а'узу би-кя ан урадда иля арзали-ль-'умур, ва а'узу би-кя мин фитнати-д-дунья, ва а'узу би-кя мин 'азаби-ль-кабр.",
        src: "аль-Бухари 6370, 2822" },
      { id: "d-pr-janna", title: "Прошу Тебя о Рае", how: "Пророк (мир ему и благословение Аллаха) спросил одного человека, что он говорит в молитве. Тот ответил: «Я произношу ташаххуд, а затем говорю: … Но я не умею молиться так, как ты и Му'аз». Пророк сказал: «И мы молимся примерно об этом же».",
        ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ",
        ru: "О Аллах, поистине, я прошу Тебя о Рае и прибегаю к Тебе от Огня!",
        tr: "Аллахумма, инни ас'алю-кя-ль-джанната ва а'узу би-кя мина-н-нар.",
        src: "Абу Дауд 792" },
      { id: "d-pr-bi-ilmika", title: "Своим знанием сокровенного", how: "'Аммар ибн Ясир (да будет доволен им Аллах) произносил в молитве мольбы, которые слышал от Пророка (мир ему и благословение Аллаха), среди них эту:",
        ar: "اللَّهُمَّ بِعِلْمِكَ الْغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلْقِ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِي اللَّهُمَّ وَأَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ وَأَسْأَلُكَ الْقَصْدَ فِي الْفَقْرِ وَالْغِنَى وَأَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لَا تَنْقَطِعُ وَأَسْأَلُكَ الرِّضَاءَ بَعْدَ الْقَضَاءِ وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ وَالشَّوْقَ إِلَى لِقَائِكَ فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ وَلَا فِتْنَةٍ مُضِلَّةٍ اللَّهُمَّ زَيِّنَّا بِزِينَةِ الإِيمَانِ وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ",
        ru: "О Аллах, посредством Своего знания о сокровенном и Своей способности творить продли мою жизнь, если Ты знаешь, что жизнь будет для меня лучше, и упокой меня, если Ты знаешь, что смерть будет для меня лучше! О Аллах, я прошу Тебя позволить мне бояться Тебя в сокровенном и явном, и я прошу Тебя позволить мне произносить слова истины в довольстве и гневе, и я прошу Тебя об умеренности в бедности и богатстве, и я прошу Тебя о блаженстве, которое не закончится, и я прошу Тебя о радости, которая не прервётся, и я прошу Тебя о довольстве после приговора, и я прошу Тебя о приятной жизни после смерти, и я прошу Тебя позволить мне испытать сладость взгляда на лик Твой и стремиться к встрече с Тобой так, чтобы не помешало этому ни несчастье, которое нанесёт вред, ни искушение, которое собьёт с пути! О Аллах, укрась нас украшением веры и сделай нас ведущими других и идущими правильным путём.",
        tr: "Аллахумма, би-'ильми-кя-ль-гайба ва кудрати-кя 'аля-ль-хальк, ахйи-ни ма 'алимта-ль-хайата хайран ли, ва таваффа-ни иза 'алимта-ль-вафата хайран ли. Аллахумма, ва ас'алю-кя хашйата-кя фи-ль-гайби ва-ш-шахада, ва ас'алю-кя кялимата-ль-хакки фи-р-рида ва-ль-гадаб, ва ас'алю-кя-ль-касда фи-ль-факри ва-ль-гына, ва ас'алю-кя на'иман ля йанфад, ва ас'алю-кя куррата 'айнин ля танкати', ва ас'алю-кя-р-рида'а ба'да-ль-када', ва ас'алю-кя барда-ль-'айши ба'да-ль-маут, ва ас'алю-кя ляззата-н-назари иля ваджхи-кя ва-ш-шаука иля лика'и-к, фи гайри дарра'а мудырра ва ля фитнатин мудылля. Аллахумма, заййин-на би-зинати-ль-иман, ва-дж'аль-на худатан мухтадин.",
        src: "ан-Насаи 1305" },
      { id: "d-pr-ahad", title: "О Аллах, Единый, Самодостаточный", how: "Пророк (мир ему и благословение Аллаха) вошёл в мечеть и услышал, как человек, заканчивая молитву, в ташаххуде говорил эти слова. Пророк трижды сказал: «Он прощён».",
        ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا اللَّهُ بِأَنَّكَ الْوَاحِدُ الأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ أَنْ تَغْفِرَ لِي ذُنُوبِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ",
        ru: "О Аллах, поистине, я прошу Тебя, о Аллах, поскольку Ты — Единственный, Один, Вечный, который не родил и не был рождён, и нет никого, равного Ему, простить мне мои грехи. Поистине, Ты — Прощающий, Милосердный!",
        tr: "Аллахумма, инни ас'алю-кя йа Аллаху би-анна-кя-ль-Вахиду-ль-Ахаду-с-Самад, аллязи лям йалид ва лям йуляд ва лям йакун ля-ху куфуван ахад, ан тагфира ли зунуби, инна-кя Анта-ль-Гафуру-р-Рахим.",
        src: "ан-Насаи 1301" },
      { id: "d-pr-mannan", title: "Дарующий блага, Создатель небес и земли", how: "Анас (да будет доволен им Аллах) рассказал, что один человек молился и сказал эти слова. Пророк (мир ему и благословение Аллаха) сказал: «Он воззвал к Аллаху Его величайшим именем: если взывают этим именем — Он отвечает, а если просят — даёт».",
        ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ الْمَنَّانُ بَدِيعُ السَّمَوَاتِ وَالأَرْضِ يَا ذَا الْجَلَالِ وَالإِكْرَامِ يَا حَىُّ يَا قَيُّومُ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ",
        ru: "О Аллах, я прошу Тебя, ведь Тебе принадлежит хвала, нет бога, кроме одного лишь Тебя, у Тебя нет сотоварища, Дарующего блага, Создателя небес и земли! О Обладатель величия и щедрости! О Живой, о Вечносущий! Я прошу Тебя о Рае и прибегаю к Тебе от Огня.",
        tr: "Аллахумма, инни ас'алю-кя би-анна ля-кя-ль-хамд, ля иляха илля Анта вахда-кя ля шарикя ля-кя-ль-Маннан, Бади'у-с-самавати ва-ль-ард, йа За-ль-Джаляли ва-ль-Икрам, йа Хаййу йа Каййум, инни ас'алю-кя-ль-джанната ва а'узу би-кя мина-н-нар.",
        src: "Абу Дауд 1495, ан-Насаи 1300; «вахдака ля шарика лак» — Ибн Маджа 3858; последние слова — по книге «Крепость мусульманина»" },
      { id: "d-pr-ashhadu", title: "Свидетельствую, что Ты — Аллах", how: "Пророк (мир ему и благословение Аллаха) услышал, как человек говорил эти слова, и сказал: «Ты попросил Аллаха именем, которым если Его просят — Он даёт, а если взывают — Он отвечает».",
        ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ أَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ الأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
        ru: "О Аллах, поистине, я обращаюсь к Тебе с просьбой, потому что я свидетельствую, что Ты — Аллах и нет бога, кроме Тебя, Одного, Вечного, который не родил и не был рождён, и нет никого, равного Ему.",
        tr: "Аллахумма, инни ас'алю-кя анни ашхаду анна-кя Анта-Ллаху ля иляха илля Анта-ль-Ахаду-с-Самад, аллязи лям йалид ва лям йуляд ва лям йакун ля-ху куфуван ахад.",
        src: "Абу Дауд 1493" },
    ] },
    { id: "pr-after", name: "После молитвы", tile: "blue", icon: "dome", items: [
      { id: "d-pr-astaghfir", title: "Прошу прощения у Аллаха — 3 раза", how: "Закончив молитву, Пророк (мир ему и благословение Аллаха) трижды просил прощения, а затем говорил:",
        ar: "أَسْتَغْفِرُ اللَّهَ\nاللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ ذَا الْجَلَالِ وَالإِكْرَامِ",
        ru: "Прошу прощения у Аллаха (3 раза).\nО Аллах, Ты — Мир, и от Тебя — мир, благословен Ты, о Обладатель величия и щедрости!",
        tr: "Астагфиру-Ллах (3 раза). Аллахумма, Анта-с-Салям ва мин-кя-с-салям, табаракта за-ль-джаляли ва-ль-икрам.",
        src: "Муслим 591" },
      { id: "d-pr-mani", title: "Никто не лишит того, что Ты дал", how: "После каждой обязательной молитвы Пророк (мир ему и благословение Аллаха) говорил:",
        ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهْوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
        ru: "Нет бога, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он всё может! О Аллах, никто не лишит того, что Ты даровал, и никто не дарует того, чего Ты лишил, и бесполезным перед Тобой окажется могущество обладающего могуществом.",
        tr: "Ля иляха илля-Ллаху вахда-ху ля шарикя ля-х, ля-ху-ль-мульку ва ля-ху-ль-хамду ва хуа 'аля кулли шай'ин кадир. Аллахумма, ля мани'а ли-ма а'тайт, ва ля му'тыйа ли-ма мана'т, ва ля йанфа'у за-ль-джадди мин-кя-ль-джадд.",
        src: "аль-Бухари 844" },
      { id: "d-pr-mukhlisin", title: "Мы искренни перед Ним в религии", how: "Абдуллах ибн аз-Зубайр (да будет доволен им Аллах) говорил это после каждой молитвы, произнеся салам, и сказал, что Пророк (мир ему и благословение Аллаха) произносил эти слова после каждой молитвы.",
        ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَلَا نَعْبُدُ إِلَّا إِيَّاهُ لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ",
        ru: "Нет бога, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он всё может! Нет мощи и силы ни у кого, кроме Аллаха. Нет бога, кроме Аллаха, и не поклоняемся мы никому, кроме Него! Ему принадлежат блага, Ему принадлежат достоинства, и Ему — прекрасная хвала! Нет бога, кроме Аллаха, а мы искренни в религии перед Ним, даже если это и не нравится неверным.",
        tr: "Ля иляха илля-Ллаху вахда-ху ля шарикя ля-х, ля-ху-ль-мульку ва ля-ху-ль-хамду ва хуа 'аля кулли шай'ин кадир. Ля хауля ва ля куввата илля би-Ллях. Ля иляха илля-Ллаху ва ля на'буду илля иййа-х, ля-ху-н-ни'мату ва ля-ху-ль-фадлю ва ля-ху-с-сана'у-ль-хасан. Ля иляха илля-Ллаху мухлисына ля-ху-д-дина ва ляу кариха-ль-кяфирун.",
        src: "Муслим 594" },
      { id: "d-pr-tasbih", title: "Тасбих после молитвы — 33 раза", how: "Пророк (мир ему и благословение Аллаха) сказал: «Кто после каждой молитвы скажет «Субхана-Ллах» 33 раза, «Аль-хамду ли-Ллях» 33 раза и «Аллаху акбар» 33 раза — это девяносто девять, — а сотым скажет: «Ля иляха илля-Ллаху вахдаху…», тому простятся его грехи, даже если их будет столько, сколько морской пены».",
        ar: "سُبْحَانَ اللَّهِ\nالْحَمْدُ لِلَّهِ\nاللَّهُ أَكْبَرُ\nلَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ",
        ru: "Пречист Аллах (33 раза).\nХвала Аллаху (33 раза).\nАллах велик (33 раза).\nНет бога, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он всё может!",
        tr: "Субхана-Ллах (33 раза). Аль-хамду ли-Ллях (33 раза). Аллаху акбар (33 раза). Ля иляха илля-Ллаху вахда-ху ля шарикя ля-х, ля-ху-ль-мульку ва ля-ху-ль-хамду ва хуа 'аля кулли шай'ин кадир.",
        src: "Муслим 597" },
      { id: "d-pr-muawwidhat", title: "Суры-заступницы после каждой молитвы", how: "'Укба ибн 'Амир (да будет доволен им Аллах) сказал: «Посланник Аллаха (мир ему и благословение Аллаха) велел мне читать «аль-Му'аввизат» (последние суры Корана) после каждой молитвы».",
        ar: [az("m-ikhlas"), az("m-falaq"), az("m-nas")].map(z => z.ar).join("\n"),
        ru: [az("m-ikhlas"), az("m-falaq"), az("m-nas")].map(z => z.ru).join("\n"),
        tr: [az("m-ikhlas"), az("m-falaq"), az("m-nas")].map(z => z.tr).join(" "),
        src: "Абу Дауд 1523" },
      { id: "d-pr-kursi", title: "Аят аль-Курси после каждой молитвы", how: "Тому, кто читает аят аль-Курси после каждой обязательной молитвы, ничто не мешает войти в Рай, кроме смерти.",
        ar: az("m-kursi").ar, ru: az("m-kursi").ru, tr: az("m-kursi").tr,

    { id: "pr-istikhara", name: "Истихара", tile: "purple", icon: "question", items: [
      { id: "d-pr-istikhara", title: "Молитва о выборе", how: "Передают, что Джабир ибн Абдуллах (да будет доволен Аллах ими обоими) сказал: «Посланник Аллаха (мир ему и благословение Аллаха) учил нас, как следует просить благословения Аллаха на совершение любого дела, подобно тому, как он учил нас суре Корана. Он говорил: «Если кто-то из вас задумает какое-то дело, пусть совершит два раката необязательной молитвы, а затем скажет:» Потом Пророк говорил: «И после этого человеку следует сказать, чего он хочет»».",
        ar: "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ وَتَعْلَمُ وَلَا أَعْلَمُ وَأَنْتَ عَلَّامُ الْغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِي الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ",
        ru: "О Аллах, я прошу Тебя помочь мне сделать выбор Твоим знанием, прошу Тебя дать мне силы Твоим могуществом и прошу Тебя оказать мне великую милость, ибо Ты можешь, а я не могу, Ты знаешь, а я не знаю, и Ты знаешь всё о сокрытом! О Аллах, если знаешь Ты, что это дело станет благом для моей религии, для моей жизни и для исхода моих дел, то предопредели его мне, облегчи его для меня, а потом дай мне Своё благословение в нём. Если же Ты знаешь, что это дело окажется вредным для моей религии, для моей жизни и для исхода моих дел, то уведи его от меня и уведи меня от него, предопредели мне благо, где бы оно ни было, а потом приведи меня к довольству им.",
        tr: "Аллахумма, инни астахиру-кя би-'ильми-к, ва астакдиру-кя би-кудрати-к, ва ас'алю-кя мин фадли-кя-ль-'азым, фа-инна-кя такдиру ва ля акдир, ва та'ляму ва ля а'лям, ва Анта 'алляму-ль-гуюб. Аллахумма, ин кунта та'ляму анна хаза-ль-амра хайрун ли фи дини ва ма'аши ва 'акыбати амри, фа-кдур-ху ли ва яссир-ху ли сумма барик ли фи-х. Ва ин кунта та'ляму анна хаза-ль-амра шаррун ли фи дини ва ма'аши ва 'акыбати амри, фа-сриф-ху 'анни ва-сриф-ни 'ан-х, ва-кдур лия-ль-хайра хайсу кян, сумма арды-ни би-х.",

    { id: "witr", name: "Витр", tile: "indigo", icon: "moon", items: [

        tr: "Аллахумма-гфир ля-ху ва-рхам-ху ва 'афи-хи ва-'фу 'ан-ху, ва акрим нузуля-ху, ва вассы' мудхаля-ху, ва-гсиль-ху би-ль-ма'и ва-с-сальджи ва-ль-барад, ва накка-хи мина-ль-хатайа кя-ма наккайта-с-сауба-ль-абйада мина-д-данас, ва абдиль-ху даран хайран мин дари-хи, ва ахлян хайран мин ахли-хи, ва заудждан хайран мин зауджи-хи, ва адхиль-ху-ль-джанната, ва а'ыз-ху мин 'азаби-ль-кабри ва 'азаби-н-нар.",
        src: "Муслим 963" },
      { id: "d-fu-j2", title: "Прости нашим живым и мёртвым", how: "Совершая молитву над умершим, Пророк (мир ему и благословение Аллаха) говорил:",
        ar: "اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا وَشَاهِدِنَا وَغَائِبِنَا وَصَغِيرِنَا وَكَبِيرِنَا وَذَكَرِنَا وَأُنْثَانَا اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الإِسْلَامِ وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الإِيمَانِ اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ وَلَا تُضِلَّنَا بَعْدَهُ",
        ru: "О Аллах, прости нашим живым и мёртвым, присутствующим и отсутствующим, малым и большим, мужчинам и женщинам! О Аллах, того из нас, кому Ты даруешь жизнь, оживи в исламе, а того, кого упокоишь, упокой в вере! О Аллах, не лишай нас награды за него и не сбивай нас с пути после него!",
        tr: "Аллахумма-гфир ли-хаййи-на ва майити-на, ва шахиди-на ва га'иби-на, ва сагыри-на ва кябири-на, ва закари-на ва унса-на. Аллахумма, ман ахйайта-ху мин-на фа-ахйи-хи 'аля-ль-ислям, ва ман таваффайта-ху мин-на фа-таваффа-ху 'аля-ль-иман. Аллахумма, ля тахрим-на аджра-ху ва ля тудылля-на ба'да-х.",
        src: "Ибн Маджа 1498" },
      { id: "d-fu-j3", title: "Он под Твоим покровительством", how: "Василя ибн аль-Аска' (да будет доволен им Аллах) слышал, как Пророк (мир ему и благословение Аллаха), совершая молитву над умершим мусульманином, говорил эти слова. Вместо «такой-то, сын такого-то» называют имя умершего.",
        ar: "اللَّهُمَّ إِنَّ فُلَانَ بْنَ فُلَانٍ فِي ذِمَّتِكَ وَحَبْلِ جِوَارِكَ فَقِهِ مِنْ فِتْنَةِ الْقَبْرِ وَعَذَابِ النَّارِ وَأَنْتَ أَهْلُ الْوَفَاءِ وَالْحَقِّ فَاغْفِرْ لَهُ وَارْحَمْهُ إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ",
        ru: "О Аллах, такой-то, сын такого-то, — под Твоим покровительством и под Твоей защитой. Убереги же его от испытания могилы и от наказания Огня. Ты верен обещанию, и Ты — Истина. Прости же его и помилуй, поистине, Ты — Прощающий, Милосердный!",
        tr: "Аллахумма, инна фуляна-бна фулянин фи зиммати-кя ва хабли дживари-к, фа-кы-хи мин фитнати-ль-кабри ва 'азаби-н-нар, ва Анта ахлю-ль-вафа'и ва-ль-хакк, фа-гфир ля-ху ва-рхам-х, инна-кя Анта-ль-Гафуру-р-Рахим.",
        src: "Ибн Маджа 1499" },
      { id: "d-fu-j4", title: "Раб Твой нуждается в Твоём милосердии", how: "Мольба за умершего во время джаназа-намаза:",
        ar: "اللَّهُمَّ عَبْدُكَ وَابْنُ أَمَتِكَ احْتَاجَ إِلَى رَحْمَتِكَ، وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهِ، إِنْ كَانَ مُحْسِناً فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئاً فَتَجَاوَزْ عَنْهُ",
        ru: "О Аллах, раб Твой и сын рабыни Твоей нуждается в Твоём милосердии, а Ты не нуждаешься в его наказании. Если он творил благое, то увеличь его добрые дела, а если совершал дурное, то не взыщи с него.",
        tr: "Аллахумма, 'абду-кя ва-бну амати-кя-хтаджа иля рахмати-к, ва Анта ганийун 'ан 'азаби-х. Ин кяна мухсинан фа-зид фи хасанати-х, ва ин кяна муси'ан фа-таджаваз 'ан-х.",
        src: "аль-Хаким 1/359" },
    ] },

   2. СОСТОЯНИЕ
   ================================================================ */
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

// Ключ хранения — сегодняшняя дата по МЕСТНОМУ времени телефона, например "azkar-2026-10-06".
// Новый день → новый ключ → счётчики сами начинаются с нуля.
// (toISOString() тут не годится: он берёт дату по Гринвичу, и в Москве день менялся бы в 3 часа ночи)
function todayKey() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `azkar-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
let KEY = todayKey();
let counts = load(KEY, {});

// Если наступил новый день, пока приложение было открыто, — переключаемся на новый ключ
function checkNewDay() {
  if (todayKey() === KEY) return false;
  KEY = todayKey();
  counts = load(KEY, {});
  cleanOldDays();
  return true;
}

// Удаляем счётчики прошлых дней, чтобы память браузера не копила их годами
function cleanOldDays() {
  try {
    for (let k = localStorage.length - 1; k >= 0; k--) {
      const name = localStorage.key(k);
      if (/^azkar-\d{4}-\d{2}-\d{2}$/.test(name) && name !== KEY) localStorage.removeItem(name);
    }
  } catch (e) {}
}
cleanOldDays();
let time = "morning";              // какие азкары открыты сейчас
let index = 0;                     // номер текущей карточки
let items = [];                    // азкары выбранного времени
const ckey = z => time + ":" + z.id;
let mode = load("azkar-mode", "cards");
// Набор: "main" — основные, "full" — полные (основные + отмеченные full: true)
let azkarSet = load("azkar-set", "main") === "full" ? "full" : "main";
// «Полные» = все «Основные» + азкары с full: true, в порядке из видео Майрбека.
// Одинаковые азкары — одна и та же запись (тот же текст, источник и прогресс счётчика).
// Исключение: «Ля иляха илля-Ллах» — в полных 100 раз (f-14, тот же текст и источник), в основных 10.
const FULL_ORDER = {
  morning: ["m-ikhlas", "m-falaq", "m-nas", "m-sayyid", "m-adada", "m-hasbi", "m-bismillah", "m-radiitu", "m-bika",
            "m-hayyu", "fm-fath", "m-fitra", "m-asbahna", "m-alim", "f-14", "m-subhan100",
            "m-kursi", "f-17", "f-18", "f-19", "f-20", "f-21", "m-afiya", "fm-ilm", "fm-istighfar", "fm-salawat"],
  // вечер: e-bika и e-alim в видео нет, но они в «Основных» — стоят там же, где в утренних.
  // f-19…f-21 — те же записи, что утром (текст в видео тот же), прогресс у вечера свой
  evening: ["e-ikhlas", "e-falaq", "e-nas", "e-sayyid", "e-hasbi", "e-bismillah", "e-radiitu", "e-bika",
            "fe-ushhiduka", "e-hayyu", "fe-fath", "fe-fitra", "fe-maamsa", "e-alim", "fe-tahlil100", "e-subhan100",
            "e-kursi", "fe-baqara285", "fe-baqara286", "f-19", "f-20", "f-21", "e-amsayna", "e-kalimat", "e-afiya", "fe-salawat"],
};
function setItems(t) {
  if (azkarSet === "full" && FULL_ORDER[t]) return FULL_ORDER[t].map(id => AZKAR.find(z => z.id === id));
  return AZKAR.filter(z => z.when.includes(t) && !z.full);
}
// «азкар» по-русски: 1 азкар, 2 азкара, 5 азкаров
const plural = n => n % 10 === 1 && n % 100 !== 11 ? "азкар" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "азкара" : "азкаров";   // вид чтения: "cards" — по одному, "list" — списком
// что показывать в азкарах; по умолчанию всё включено
let show = Object.assign({ ar: true, ru: true, tr: true }, load("azkar-show", {}));


/* Отметки на главной: прочитаны ли сегодня все утренние / все вечерние азкары */
function updateHome() {
  checkNewDay();   // если день сменился — отметки должны пропасть
  renderAyah();   // в полночь — новый аят
  for (const t of ["morning", "evening"]) {
    const all = setItems(t);
    const done = all.every(z => (counts[t + ":" + z.id] || 0) >= z.times);
    const btn = document.getElementById("go-" + t);
    btn.classList.toggle("done", done);
    btn.setAttribute("aria-label", (t === "morning" ? "Утренние" : "Вечерние") + " азкары" + (done ? " — прочитаны сегодня" : ""));
  }
}

/* Аят дня. Номер дня считаем по МЕСТНОЙ дате телефона (как и счётчики),
   поэтому у всех в один день один аят, и он сам меняется в полночь — без интернета */
function dayNumber(d = new Date()) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function ayahOfDay(d) { return AYAT[dayNumber(d) % AYAT.length]; }
function renderAyah() {
  const a = ayahOfDay(), box = document.getElementById("ayah-day");
  if (box.dataset.ref === a.ref) return;   // тот же аят — ничего не перерисовываем
  box.dataset.ref = a.ref;
  document.getElementById("ayah-ar").innerHTML = arabic(a.ar);
  document.getElementById("ayah-ru").textContent = a.ru;
  document.getElementById("ayah-ref").textContent = "Сура " + a.ref;
  box.setAttribute("aria-expanded", "false");
}
document.getElementById("ayah-day").addEventListener("click", e => {
  const box = e.currentTarget;
  box.setAttribute("aria-expanded", box.getAttribute("aria-expanded") === "true" ? "false" : "true");
});

/* Переключатель «Основные | Полные» на главной */
function renderSet(animate) {
  document.getElementById("set-switch").dataset.set = azkarSet;
  document.querySelectorAll(".set-opt").forEach(o => o.setAttribute("aria-checked", o.dataset.set === azkarSet ? "true" : "false"));
  for (const t of ["morning", "evening"]) {
    const el = document.getElementById("count-" + t), n = setItems(t).length;
    el.textContent = `${n} ${plural(n)}`;
    if (animate) { el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); }
  }
}
document.querySelectorAll(".set-opt").forEach(o => o.addEventListener("click", () => {
  if (o.dataset.set === azkarSet) return;
  azkarSet = o.dataset.set;
  store("azkar-set", azkarSet);
  renderSet(true);
  updateHome();   // галочка «прочитано» зависит от набора
}));
renderSet(false);

/* Переключение экранов: показываем один, остальные прячем */
function showScreen(id) {
  for (const el of document.querySelectorAll(".screen")) el.hidden = el.id !== id;
  const screen = document.getElementById(id);
  screen.scrollTop = 0;
  // перезапускаем анимацию появления: убрали класс → браузер «забыл» → добавили снова
  screen.classList.remove("enter");
  void screen.offsetWidth;
  screen.classList.add("enter");
  // Когда анимация закончилась, снимаем её полностью — так iPhone рисует текст заново, чётко
  clearTimeout(screen._enterTimer);
  screen._enterTimer = setTimeout(() => screen.classList.remove("enter"), 900);
  // Нижняя панель видна везде, кроме чтения азкаров: там внизу счётчик
  const tabbar = document.getElementById("tabbar");
  tabbar.classList.toggle("away", id === "reader");
  document.getElementById("tab-veil").classList.toggle("away", id === "reader");
  if (id === "home") updateHome();
  if (id === "duas") renderDuas();
  document.getElementById("toast").classList.remove("show");   // подсказка не переезжает на другой экран
  // чтение азкаров относится к «Главной», страница темы дуа — к «Дуа»
  const tab = id === "reader" ? "home" : id === "dua-read" ? "duas" : id;
  tabbar.dataset.active = tab;   // по этому атрибуту подложка переезжает на нужную вкладку
  document.querySelectorAll(".tab-item").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.screen === tab ? "true" : "false"));
}
document.querySelectorAll(".tab-item").forEach(t =>
  t.addEventListener("click", () => showScreen(t.dataset.screen)));

/* Настройки */
const MODE_NAMES = { cards: "По одному", list: "Списком" };
// Тема: "light", "dark" или "system" (как в телефоне). По умолчанию — как в системе
const THEME_NAMES = { light: "Светлая", dark: "Тёмная", system: "Как в системе" };
let theme = load("azkar-theme", "system");
const systemDark = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const dark = theme === "dark" || (theme === "system" && systemDark.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  // цвет полосы браузера и строки состояния — под цвет фона
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = dark ? "#0e1310" : "#ffffff");
}
// телефон сам переключил тему (например, вечером по расписанию) — переключаемся и мы
systemDark.addEventListener("change", () => { if (theme === "system") applyTheme(); });
// Размер текста: множители для арабского (ar) и для перевода с транскрипцией (tx). 1 = обычный
let size = Object.assign({ ar: 1, tx: 1 }, load("azkar-size", {}));
const pct = k => Math.round(k * 100) + "%";

function renderSettings() {
  // переключатели
  for (const key of ["ar", "ru", "tr"]) {
    document.getElementById("sw-" + key).setAttribute("aria-checked", show[key] ? "true" : "false");
    document.body.classList.toggle("no-" + key, !show[key]);   // CSS по этому классу прячет часть текста
  }
  // вид чтения
  document.getElementById("mode-value").textContent = MODE_NAMES[mode];
  applyTheme();
  document.getElementById("theme-value").textContent = THEME_NAMES[theme];
  document.querySelectorAll(".choice-row[data-theme-choice]").forEach(o =>
    o.setAttribute("aria-checked", o.dataset.themeChoice === theme ? "true" : "false"));
  // размер текста: множители на <html> — их подхватывают все азкары и образец в окне
  const root = document.documentElement.style;
  root.setProperty("--ar-k", size.ar);
  root.setProperty("--tx-k", size.tx);
  document.getElementById("size-value").textContent =
    size.ar === 1 && size.tx === 1 ? "Обычный" : size.ar === size.tx ? pct(size.ar) : `${pct(size.ar)} · ${pct(size.tx)}`;
  for (const key of ["ar", "tx"]) {
    const r = document.getElementById("size-" + key);
    r.value = size[key];
    r.style.setProperty("--p", (size[key] - r.min) / (r.max - r.min) * 100 + "%");   // зелёная часть дорожки
    document.getElementById(`size-${key}-out`).textContent = pct(size[key]);
  }
  document.getElementById("size-reset").disabled = size.ar === 1 && size.tx === 1;
  document.querySelectorAll(".choice-row[data-mode]").forEach(o =>
    o.setAttribute("aria-checked", o.dataset.mode === mode ? "true" : "false"));
}

document.querySelectorAll(".switch").forEach(sw => sw.addEventListener("click", () => {
  show[sw.dataset.key] = !show[sw.dataset.key];
  store("azkar-show", show);
  renderSettings();
}));

// Закрыть выезжающее окно: сначала анимация ухода, потом прячем
function closeSheet(el = sheet) {
  el.classList.add("closing");
  setTimeout(() => { el.hidden = true; el.classList.remove("closing"); }, 220);
}
/* Любое выезжающее окно можно смахнуть пальцем вниз, как в iOS.
   Окно едет за пальцем; отпустили ниже трети высоты или смахнули быстро — закрывается, иначе возвращается.
   Не мешаем ползункам размера текста и прокрутке длинных списков внутри окна */
function closeSheetFrom(back, el) {
  el.style.transition = "transform .22s cubic-bezier(.3, .7, .3, 1)";
  el.style.transform = "translateY(100%)";
  back.classList.add("closing-drag");
  setTimeout(() => { back.hidden = true; back.classList.remove("closing-drag"); el.style.transition = el.style.transform = ""; }, 220);
}
document.querySelectorAll(".sheet-back").forEach(back => {
  const el = back.querySelector(".sheet");
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false;
  el.addEventListener("touchstart", e => {
    const tgt = e.target;
    if (e.touches.length !== 1 || tgt.closest("input[type=range], input[type=search]")) { y0 = null; return; }
    const list = tgt.closest(".sheet-list, #city-list");
    if (list && list.scrollTop > 0) { y0 = null; return; }   // список прокручен — сначала он едет вверх
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const ny = e.touches[0].clientY - y0, nx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (Math.abs(nx) > Math.abs(ny) || ny < 6) { if (ny < -6 || Math.abs(nx) > 10) y0 = null; return; }
      dragging = true; el.style.transition = "none";
    }
    dy = Math.max(0, ny);
    el.style.transform = `translateY(${dy}px)`;
    if (e.cancelable) e.preventDefault();   // пока тянем окно, страница под ним не прокручивается
  }, { passive: false });
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (!dragging) return;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    if (dy > el.offsetHeight / 3 || (fast && dy > 30)) closeSheetFrom(back, el);
    else { el.style.transition = "transform .25s cubic-bezier(.3, .7, .3, 1)"; el.style.transform = ""; setTimeout(() => { el.style.transition = ""; }, 260); }
  };
  el.addEventListener("touchend", end);
  el.addEventListener("touchcancel", end);
});

function openTime(t) {
  checkNewDay();
  time = t;
  items = setItems(time);
  // начинаем с первого непрочитанного зикра
  index = items.findIndex(z => (counts[ckey(z)] || 0) < z.times);
  if (index === -1) index = items.length;          // всё прочитано → сразу финальная карточка
  const cards = mode === "cards";
  document.getElementById("viewport").hidden = !cards;
  document.getElementById("list-view").hidden = cards;
  showScreen("reader");
  // Очищаем неиспользуемый вид. Иначе на странице остаются невидимые карточки
  // со счётчиками с теми же id, и программа обновляет их вместо видимых
  document.getElementById(cards ? "list-view" : "track").innerHTML = "";
  if (cards) { buildSlides(); goTo(index, false); }
  else { buildList(); updatePos(); }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  // запасной способ для старых браузеров
  const a = document.createElement("textarea"); a.value = text; a.setAttribute("readonly", "");
  a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  a.remove(); return ok;
}
document.getElementById("dua-cards").addEventListener("click", async e => {

// создаём на время анимации и потом удаляем
function favBurst(b, on) {
  b.classList.remove("pop", "unpop"); void b.offsetWidth;
  b.classList.add(on ? "pop" : "unpop");
  if (!on) return;
  const parts = [Object.assign(document.createElement("i"), { className: "fav-ring" })];
  const colors = ["#ff9500", "#ffcc00", "#34c759", "#ff9500"];
  for (let k = 0; k < 8; k++) {

    sp.style.setProperty("--a", k * 45 + 22 + "deg");   // восемь лучей по кругу
    sp.style.setProperty("--c", colors[k % colors.length]);
    parts.push(sp);
  }
  parts.forEach(x => b.appendChild(x));
  setTimeout(() => parts.forEach(x => x.remove()), 700);
}

/* ================================================================
   4. КАРТОЧКИ
   ================================================================ */
// В шрифте Hafs арабская запятая «،» нарисована как кружок,
// поэтому показываем её обычным шрифтом
// Подготовка арабского текста к показу. Сами данные не меняем — только то, как они выглядят
function arabic(text) {
  return text
    // 1. Номер аята «[١]» → «١»: шрифт Hafs сам рисует номер в узорном кружке, скобки не нужны
    .replace(/\[([\u0660-\u0669]+)\]/g, '$1')
    // 1а. Сукун. В мусхафе Медины он похож на головку буквы «х» (ۡ), а не на кружок.
    //     В тексте (как у quran.com) сукун записан обычным знаком U+0652, а шрифт Hafs
    //     рисует его кружком. Поэтому показываем мусхафный сукун U+06E1.
    .replace(/\u0652/g, '\u06E1')
    // 1б. Знак немого алифа (U+06DF) браузер рисует кляксой ◉. Показываем его кружком U+0652:
    //     в мусхафе над непроизносимыми буквами как раз пустой кружок.
    //     Порядок важен: сначала 1а, иначе этот кружок тоже превратился бы в сукун
    .replace(/\u06DF/g, '\u0652')
    // 2. Икляб: танвин + маленький мим. В мусхафе Медины (под него сделан шрифт) здесь пишут
    //    одну огласовку + мим, иначе мим наезжает на танвин: «ٌۢ» → «ُۢ», «ًۢ» → «َۢ», «ٍۭ» → «ِۭ»
    .replace(/\u064C\u06E2/g, '\u064F\u06E2')
    .replace(/\u064B\u06E2/g, '\u064E\u06E2')
    .replace(/\u064D\u06ED/g, '\u0650\u06ED')
    // 3. Номер аята не должен отрываться от последнего слова и уезжать на новую строку
    .replace(/(\S+) ([\u0660-\u0669]+)/g, '<span class="nowrap">$1 $2</span>')
    // 4. Запятая «،»: неразрывный пробел перед ней, чтобы она не уезжала в начало строки,
    //    и обычный шрифт, потому что в шрифте Hafs она нарисована кружком
    .replace(/ ،/g, '\u00A0،')
    .replace(/،/g, '<span class="ar-comma">،</span>')
    // 5. Перенос строки (после басмалы)
    .replace(/\n/g, '<br>');
}

// Кнопка-счётчик одинаковая в обоих видах
function counterHTML(i) {
  return `<button class="counter" id="counter-${i}">
      <i class="fill"></i><span class="label"></span><span class="num"></span>
    </button>`;
}
function contentHTML(z) {
  return `<div class="content">
      <p class="ar" lang="ar">${arabic(z.ar)}</p>
      <div class="divider"></div>
      <p class="ru">${z.ru}</p>
      ${z.tr ? `<p class="tr">${z.tr}</p>` : ""}
      <p class="src">Источник: ${z.src}</p>
    </div>`;
}
function finalHTML() {
  return `<div class="final">
      <h2>${time === "morning" ? "Утренние" : "Вечерние"} азкары прочитаны</h2>
      <div class="actions">
        <button class="btn to-home">На главную</button>
      </div>
    </div>`;
}

/* Вид «Списком»: все азкары друг под другом, у каждого свой счётчик */
function buildList() {
  const box = document.getElementById("list-view");
  box.innerHTML = items.map((z, i) => `
    <section class="item" id="item-${i}">
      ${contentHTML(z)}
      ${counterHTML(i)}
    </section>`).join("") + finalHTML();
  items.forEach((z, i) => {
    document.getElementById("counter-" + i).addEventListener("click", () => tap(i));
    updateCounter(i);
  });
  box.querySelector(".to-home").addEventListener("click", () => showScreen("home"));
  // открываем на первом непрочитанном (если всё прочитано — в самом конце)
  box.scrollTop = 0;
  if (index >= items.length) box.scrollTop = box.scrollHeight;
  else if (index > 0) box.scrollTop = document.getElementById("item-" + index).offsetTop - box.offsetTop;
}

/* Вид «По одному»: карточки в ряд, листаются свайпом */
function buildSlides() {
  const track = document.getElementById("track");
  track.innerHTML = "";
  items.forEach((z, i) => {
    const slide = document.createElement("section");
    slide.className = "slide";
    slide.innerHTML = `<div class="scroll">
      ${contentHTML(z)}
      <div class="dock">
        ${counterHTML(i)}
        <p class="hint">Проведите влево или вправо, чтобы перейти</p>
      </div>
    </div>`;
    slide.querySelector(".counter").addEventListener("click", () => tap(i));
    track.appendChild(slide);
    updateCounter(i);
  });

  // последняя карточка — «готово»
  const final = document.createElement("section");
  final.className = "slide";
  final.innerHTML = finalHTML();
  final.querySelector(".to-home").addEventListener("click", () => showScreen("home"));
  track.appendChild(final);
}

function updateCounter(i) {
  const z = items[i];
  const n = counts[ckey(z)] || 0;
  const btn = document.getElementById("counter-" + i);
  const full = n >= z.times;
  btn.classList.toggle("full", full);
  btn.querySelector(".fill").style.transform = `scaleX(${n / z.times})`;
  btn.querySelector(".label").textContent = full ? "Прочитано ✓" : "";   // пока читаешь — только цифры
  btn.querySelector(".num").textContent = `${n} / ${z.times}`;
}

function tap(i) {
  if (justSwiped) return;                         // палец ехал по экрану — это свайп, а не нажатие
  const z = items[i];
  const n = counts[ckey(z)] || 0;
  if (n >= z.times) { if (mode === "cards") goTo(i + 1); return; }   // уже прочитан
  counts[ckey(z)] = n + 1;
  store(KEY, counts);
  updateCounter(i);
  if (n + 1 < z.times) haptic("tap");   // на последнем нажатии — вибрация «дочитан» ниже
  const num = document.querySelector("#counter-" + i + " .num");
  num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump");
  if (mode === "list") updatePos();
  if (n + 1 === z.times) {
    haptic("done");
    // небольшая пауза, чтобы увидеть «Прочитано», потом к следующему
    if (mode === "cards") setTimeout(() => { if (index === i) goTo(i + 1); }, 600);
    else setTimeout(() => {
      const next = document.getElementById("item-" + (i + 1)) || document.querySelector("#list-view .final");
      next.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 600);
  }
}

function updatePos() {
  const done = items.filter(z => (counts[ckey(z)] || 0) >= z.times).length;
  document.getElementById("pos").textContent = `Прочитано ${done} из ${items.length}`;
}

function goTo(i, animate = true) {
  index = Math.max(0, Math.min(items.length, i));
  const track = document.getElementById("track");
  if (animate) {
    track.classList.remove("dragging");
    track.style.transform = `translate3d(${-index * 100}%, 0, 0)`;
  } else {
    // мгновенно, без анимации: на миг выключаем плавность, ставим ленту и включаем обратно
    track.classList.add("dragging");
    track.style.transform = `translate3d(${-index * 100}%, 0, 0)`;
    void track.offsetWidth;
    track.classList.remove("dragging");
  }
  [...track.children].forEach((sl, k) => {
    sl.classList.toggle("active", k === index);
    sl.classList.toggle("far", Math.abs(k - index) > 1);   // видны текущая и соседние
  });
  document.getElementById("pos").textContent =
    index < items.length ? `${index + 1} из ${items.length}` : "Готово";
}

/* ================================================================
   5. СВАЙП. Запоминаем, где палец коснулся экрана, и смотрим,
   куда он уехал. Влево больше чем на 60px — следующий зикр,
   вправо — предыдущий. Вертикальное движение оставляем браузеру
   для прокрутки длинного текста.
   ================================================================ */
const viewport = document.getElementById("viewport");
const track = document.getElementById("track");
let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, justSwiped = false;
let lastX = 0, lastT = 0, speed = 0, frame = 0, width = 0;

viewport.addEventListener("pointerdown", e => {
  startX = lastX = e.clientX; startY = e.clientY; lastT = e.timeStamp;
  dx = 0; speed = 0; dragging = true; decided = false; justSwiped = false;
  width = viewport.clientWidth;
});
viewport.addEventListener("pointermove", e => {
  if (!dragging) return;
  const mx = e.clientX - startX, my = e.clientY - startY;
  if (!decided) {
    if (Math.abs(mx) + Math.abs(my) < 10) return;
    decided = true;
    if (Math.abs(my) > Math.abs(mx)) { dragging = false; return; }   // это прокрутка вниз/вверх
    justSwiped = true;
    startX = e.clientX;                     // отсчёт с этого места — карточка трогается плавно, без скачка
    track.classList.add("dragging");
  }
  dx = e.clientX - startX;
  // у первой и последней карточки — «резинка»: тянется втрое туже
  if ((index === 0 && dx > 0) || (index === items.length && dx < 0)) dx /= 3;
  // скорость пальца (пикселей в миллисекунду) — для быстрого смаха
  const dt = e.timeStamp - lastT;
  if (dt > 0) speed = 0.8 * ((e.clientX - lastX) / dt) + 0.2 * speed;
  lastX = e.clientX; lastT = e.timeStamp;
  // двигаем ленту не чаще, чем экран рисует кадры
  if (!frame) frame = requestAnimationFrame(() => {
    frame = 0;
    track.style.transform = `translate3d(${-index * width + dx}px, 0, 0)`;
  });
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (!decided) return;
  cancelAnimationFrame(frame); frame = 0;
  // перелистываем, если протащили на пятую часть экрана или быстро смахнули
  if (dx < -width * 0.2 || (speed < -0.4 && dx < 0)) goTo(index + 1);
  else if (dx > width * 0.2 || (speed > 0.4 && dx > 0)) goTo(index - 1);
  else goTo(index);
  setTimeout(() => { justSwiped = false; }, 50);
}
viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
// При повороте экрана ширина меняется — ставим ленту ровно
window.addEventListener("resize", () => { if (!document.getElementById("reader").hidden && mode === "cards") goTo(index, false); });

// На компьютере можно листать стрелками на клавиатуре
document.addEventListener("keydown", e => {
  if (document.getElementById("reader").hidden || mode !== "cards") return;
  if (e.key === "ArrowLeft") goTo(index - 1);
  if (e.key === "ArrowRight") goTo(index + 1);
});

/* ================================================================
   6. СЧЁТЧИК (ТАСБИХ). Три независимых счётчика, у каждого своё число.
   Нажатие в любом месте средней части экрана прибавляет один.
   Числа сохраняются в памяти телефона и не обнуляются в полночь —
   только кнопкой сброса.
   ================================================================ */
let tb = Object.assign({ active: 0, values: [0, 0, 0] }, load("azkar-counter", {}));

// Лёгкий «щелчок» под пальцем. На Android есть navigator.vibrate.
// Safari на iPhone его не умеет, но с iOS 18 даёт щелчок при нажатии на переключатель
// <input type="checkbox" switch> — им и пользуемся: нажимаем невидимый переключатель программно
const hapticLabel = (() => {
  const label = document.createElement("label");
  label.style.display = "none"; label.setAttribute("aria-hidden", "true");
  const input = document.createElement("input");
  input.type = "checkbox"; input.setAttribute("switch", "");
  label.appendChild(input); document.body.appendChild(label);
  return label;
})();
// В приложении для iPhone — системная вибрация (плагин Capacitor Haptics), самая лёгкая:
//   "tap"  — каждое нажатие счётчика: короткий мягкий «тук» (ImpactStyle.Light);
//   "done" — азкар дочитан: чуть заметнее (ImpactStyle.Medium), но всё равно не резко.
// На сайте — щелчок переключателя (iOS 18) или navigator.vibrate (Android)
const HAPTICS = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
  ? window.Capacitor.Plugins.Haptics : null;
function haptic(kind = "tap") {
  if (HAPTICS) { HAPTICS.impact({ style: kind === "done" ? "MEDIUM" : "LIGHT" }).catch(() => {}); return; }
  if (navigator.vibrate) navigator.vibrate(kind === "done" ? 30 : 8);
  else hapticLabel.click();
}

function renderTasbih() {
  const n = tb.values[tb.active];
  document.getElementById("tb-num").textContent = n;
  document.getElementById("tb-hint").classList.toggle("gone", n > 0);
  document.querySelectorAll(".tb-slot").forEach(sl => {
    const k = +sl.dataset.slot;
    sl.setAttribute("aria-selected", k === tb.active ? "true" : "false");
    sl.querySelector("b").textContent = tb.values[k];
  });
}

const stage = document.getElementById("tb-tap");
stage.addEventListener("click", () => {
  tb.values[tb.active]++;
  store("azkar-counter", tb);
  // каждые 33 (33, 66, 99, …) — «тук» чуть сильнее: можно считать тасбих, не глядя на экран
  haptic(tb.values[tb.active] % 33 === 0 ? "done" : "tap");
  renderTasbih();
  const num = document.getElementById("tb-num");
  num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump");
});

document.querySelectorAll(".tb-slot").forEach(sl => sl.addEventListener("click", () => {
  tb.active = +sl.dataset.slot;
  store("azkar-counter", tb);
  renderTasbih();
}));

document.getElementById("tb-reset").addEventListener("click", () => askReset(
  `Сбросить счётчик ${tb.active + 1}?`, "Число начнётся с нуля, другие счётчики не изменятся",
  () => { tb.values[tb.active] = 0; store("azkar-counter", tb); renderTasbih(); }));

/* ================================================================
   СТАРТ
   ================================================================ */
// Запомнили, открыто ли приложение с экрана «Домой» (старые iPhone сообщают это только так)
if (navigator.standalone) document.documentElement.classList.add("standalone");
renderSettings();
renderTasbih();
showScreen("home");
</script>
